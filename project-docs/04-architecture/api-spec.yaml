openapi: 3.1.0
info:
  title: Furnixa API
  version: 0.1.0
  description: |
    REST API for the Furnixa furniture marketplace (website + admin).
    Base path /api/v1. Auth: Bearer access token (JWT). Refresh token in cookie `fx_rt` (30 days): `HttpOnly`, `Secure` from env `AUTH_COOKIE_SECURE`, `SameSite` from env `AUTH_COOKIE_SAME_SITE`, `Path=/api/v1/auth` (so it is only sent to the auth routes), optional `Domain` from `AUTH_COOKIE_DOMAIN`. Cookie-authenticated calls (`/auth/refresh`, `/auth/logout`) also need header `X-CSRF-Token` from `GET /auth/csrf` (ADR-011).
    Access token JWT: HS256 only, `iss` = `furnixa-api`, `aud` = `furnixa`, claims `sub` (user id), `role`, `jti`; all verified on every request. The server loads the user from the database on every authenticated request (401 if missing or blocked) and takes `role` from the database, not from the token. Refresh is rotating with a 10 s grace window: a just-rotated token presented again within 10 s gets 401 `REFRESH_RACE` (nothing revoked; retry with the new cookie), after that the session family is revoked. Clients must make refresh single-flight.
    All error responses use the Error schema. Locale for emails/messages via `Accept-Language: ar|en` (default `ar`).
    Prices are integer halalas (1 SAR = 100 halalas). Phone numbers are Saudi mobile numbers, returned as E.164 `+9665XXXXXXXX`.
servers:
  - url: http://localhost:4100/api/v1
tags:
  - name: Auth
  - name: Me
  - name: Catalog
  - name: CMS
  - name: Cart
  - name: Orders
  - name: Notifications
  - name: Admin
  - name: Internal
  - name: System
security:
  - bearerAuth: []

paths:
  # ---------------- SYSTEM ----------------
  /health:
    get:
      tags: [System]
      summary: Liveness check (served at the host root, not under /api/v1)
      servers:
        - url: http://localhost:4100
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  # ---------------- AUTH ----------------
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register and send email OTP (AUTH-01)
      description: |
        Email is trimmed and lower-cased. Password: 8-128 characters, at least one letter and one number.
        The OTP email is sent in the locale of `Accept-Language` (`ar`|`en`), else `preferredLocale`, else `ar`.
        Registering an email that already has an **unverified** account never changes that account: the submitted
        data (password hash, names, locale) is stored on the new OTP row and applied only when *that* OTP is verified
        (prevents pre-account takeover). Subject to the 60 s cooldown and the 5-per-hour OTP cap (429 `RATE_LIMITED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName: { type: string, minLength: 1, maxLength: 40 }
                lastName: { type: string, minLength: 1, maxLength: 40 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128, description: At least one letter and one number }
                preferredLocale: { $ref: '#/components/schemas/Locale' }
      responses:
        '201': { $ref: '#/components/responses/Message' }
        '409': { $ref: '#/components/responses/Error', description: "`EMAIL_IN_USE` - the email belongs to a verified account" }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` - cooldown or hourly OTP cap" }
  /auth/verify-otp:
    post:
      tags: [Auth]
      security: []
      summary: Verify email OTP and log in (AUTH-01)
      description: |
        Finds the unconsumed, unexpired VERIFY_EMAIL OTP whose code matches, applies that OTP's pending registration
        data to the user, marks the user verified, consumes **all** VERIFY_EMAIL OTPs of the email, and returns an
        access token plus the `fx_rt` cookie. Wrong codes are counted per email across all its VERIFY_EMAIL OTPs; the
        5th wrong code invalidates all of them. Errors (400): `OTP_INVALID` wrong code; `OTP_EXPIRED` expired,
        invalidated, already used, or no OTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '400': { $ref: '#/components/responses/Error', description: "`OTP_INVALID` or `OTP_EXPIRED`" }
        '403': { $ref: '#/components/responses/Error', description: "`ACCOUNT_BLOCKED`" }
        '422': { $ref: '#/components/responses/Error' }
  /auth/resend-otp:
    post:
      tags: [Auth]
      security: []
      summary: Resend OTP (AUTH-04)
      description: |
        Always answers the same 200 message for known and unknown emails (no email is sent for unknown ones or for
        a purpose that does not apply to the account). The 60 s cooldown and the 5-per-hour cap apply per email and
        purpose, also for unknown emails, so 429 does not reveal whether an account exists.

        **VERIFY_EMAIL requires `password`** (AUTH-01, closes the resend race). The server looks for the unexpired
        VERIFY_EMAIL OTP row of the email (also one burnt by the 5-wrong-codes lockout) whose `pendingRegistration.passwordHash` matches the password
        (argon2 verify) and binds the new OTP to that row's pending data only. If nothing matches (unknown email,
        wrong password, already verified, no live row) the response is the identical 200 and a decoy row is written,
        exactly as for an unknown email; the cooldown and hourly cap behave the same either way. A caller who does not
        know the password of a pending registration can therefore never obtain a code bound to it.
        **RESET_PASSWORD** stays `{email, purpose}`; `password` is ignored. `password` missing for VERIFY_EMAIL -> 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, purpose]
              properties:
                email: { type: string, format: email }
                purpose: { $ref: '#/components/schemas/OtpPurpose' }
                password: { type: string, minLength: 1, maxLength: 128, description: "Required when purpose is VERIFY_EMAIL; the password given at registration" }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED`" }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: |
        Email + password login (AUTH-02). Order: per-IP limit -> email lockout check -> password check -> status checks.
        While an email is locked (LOGIN_MAX_FAILURES failures within LOGIN_LOCKOUT_SECONDS) every attempt gets 429 `ACCOUNT_LOCKED` WITHOUT checking the password, for known and unknown emails alike (no password oracle); `Retry-After` is set.
        An unknown email and a wrong password both give the identical 401 `INVALID_CREDENTIALS`. `EMAIL_NOT_VERIFIED` and `ACCOUNT_BLOCKED` are returned only after the password verified.
        For an unverified account the password is matched against its pending registrations (same rule as resend-otp), the new OTP is bound to the matching one and sent, and the response is 403 `EMAIL_NOT_VERIFIED` (if the OTP cooldown or cap blocks the mail it is not sent, the response is the same).
        The per-IP limit (10 failed attempts / 15 min) does not count successful logins. The oldest session is revoked when MAX_ACTIVE_SESSIONS would be exceeded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Error', description: "`INVALID_CREDENTIALS` (unknown email or wrong password, identical body)" }
        '403':
          description: Blocked (`ACCOUNT_BLOCKED`), or unverified (`EMAIL_NOT_VERIFIED`, OTP re-sent); only after the password verified
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` (per-IP limit) or `ACCOUNT_LOCKED` (per-account lockout)" }
  /auth/csrf:
    get:
      tags: [Auth]
      security: []
      summary: Issue a CSRF token for cookie-authenticated requests (ADR-011). The token is HMAC(CSRF_SECRET, session familyId), so it stays valid across refresh rotations. Needs a valid refresh cookie.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [csrfToken], properties: { csrfToken: { type: string } } }
        '401': { $ref: '#/components/responses/Error', description: "`UNAUTHORIZED`: no valid refresh cookie" }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate refresh cookie, return new access token (AUTH-05). Requires X-CSRF-Token; a present `Origin` header must be in CORS_ALLOWED_ORIGINS (else 403 `CSRF_INVALID`).
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Error', description: "`UNAUTHORIZED` (missing, unknown, expired or revoked token, reuse after the grace window: the session family is revoked) or `REFRESH_RACE` (token rotated less than 10 s ago: retry with the new cookie, nothing revoked)" }
        '403': { description: CSRF_INVALID, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/logout:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }, {}]
      summary: Revoke the session (AUTH-05) and clear the cookie. With the refresh cookie present it requires X-CSRF-Token (and the Origin rule of /auth/refresh) and revokes the whole session family; with only a Bearer token there is no cookie to revoke and the call just succeeds.
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Error', description: "`UNAUTHORIZED`: neither a refresh cookie nor a valid Bearer token" }
        '403': { description: CSRF_INVALID, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      summary: Send reset OTP; always 200 (AUTH-03)
      description: |
        Same flow and limits as `POST /auth/resend-otp` with purpose `RESET_PASSWORD`: the identical 200 message for
        known and unknown emails (and for blocked or unverified accounts, which get no mail); the 60 s cooldown and
        the 5-per-hour cap apply per email, also for unknown emails, so a 429 does not reveal whether an account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` (OTP cooldown or hourly cap)" }
  /auth/reset-password:
    post:
      tags: [Auth]
      security: []
      summary: Reset password with OTP (AUTH-03)
      description: |
        Does **not** log the user in: it returns 200 `Message` and the user then logs in with the new password.

        **No enumeration.** Every failure to match a live `RESET_PASSWORD` code (unknown email, no live code, expired,
        already used, wrong code) is the identical 400 `OTP_INVALID` (so `OTP_EXPIRED` is never returned here), and each
        failure path spends one argon2 verify so timing matches. The 5th wrong code for an email burns every live code.
        `ACCOUNT_BLOCKED` (403) is returned only after a correct code.

        **On success, in one transaction:** the new argon2id hash and `User.passwordChangedAt` are stored, every
        refresh token of the user is revoked, every `RESET_PASSWORD` OTP of the email is consumed, and the login lockout
        (`User.failedLoginCount`, `lockedUntil` and the `login:email:<hmac>` rate-limit key) is cleared. Access tokens
        issued before or in the same second as `passwordChangedAt` are rejected with 401 `UNAUTHORIZED` (`iat <= floor(passwordChangedAt / 1000)`,
        `iat` has 1 s precision). A "Your password was changed" email (no code, no password) is then sent in the user's
        `preferredLocale`, in the background.

        **IP limit:** 10 failed attempts per 15 min per IP (successful resets do not count), so codes cannot be
        guessed across many emails; over the limit -> 429 `RATE_LIMITED` with `Retry-After`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^[0-9]{6}$' }
                newPassword: { type: string, minLength: 8, maxLength: 128, description: "At least one letter and one number (same rule as registration)" }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error', description: "`OTP_INVALID` (any failure to match a live code; see above)" }
        '403': { description: "`ACCOUNT_BLOCKED`, only after a correct code", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Error', description: "Validation error (malformed email or code, weak password); the code stays usable" }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` (per-IP limit on failed attempts)" }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '401': { $ref: '#/components/responses/Error' }

  # ---------------- ME ----------------
  /me:
    patch:
      tags: [Me]
      summary: Update profile (PROF-01)
      description: >-
        Partial update; unknown fields (email, role, isVerified, isBlocked, id, ...) are rejected with 422
        VALIDATION_ERROR and nothing changes. Strings are trimmed. `phone` is normalised to `+9665XXXXXXXX`;
        `null` clears it. `avatar` accepts an R2 key from `POST /me/avatar/presign` or `null` to remove it;
        a full URL is rejected with 422 `UPLOAD_NOT_ALLOWED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                firstName: { type: string, minLength: 1, maxLength: 40 }
                lastName: { type: string, minLength: 1, maxLength: 40 }
                phone: { oneOf: [{ $ref: '#/components/schemas/SaudiPhoneInput' }, { type: 'null' }] }
                preferredLocale: { $ref: '#/components/schemas/Locale' }
                avatar: { oneOf: [{ type: string, description: "R2 key from POST /me/avatar/presign" }, { type: 'null' }] }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '401': { $ref: '#/components/responses/Error' }
        '422':
          description: VALIDATION_ERROR (unknown field, invalid value or invalid Saudi phone) or UPLOAD_NOT_ALLOWED (invalid key, URL, wrong scope or key not belonging to this user)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /me/avatar/presign:
    post:
      tags: [Me]
      summary: Get a presigned PUT URL to upload an avatar to Cloudflare R2 (PROF-01)
      description: |
        Customer or admin. The browser then PUTs the file to `uploadUrl` with the same `Content-Type` and the signed
        `Content-Length`. Save the returned `key` and pass it to `PATCH /me` as `avatar`.
        Allowed: image/jpeg, image/png, image/webp; max 2 MB (2 097 152 bytes). SVG is never allowed.
        Key format: `furnixa/{env}/avatars/{userId}/{uuid}.{ext}`.
        Each call records an `Upload` row (scope `avatar`); the key may only be attached by the same user.
        Limit: 5 presigns per 15 minutes per user (429 `RATE_LIMITED`, `Retry-After`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, size]
              additionalProperties: false
              properties:
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                size: { type: integer, minimum: 1, maximum: 2097152, description: Bytes }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [uploadUrl, key, publicUrl, expiresIn]
                properties:
                  uploadUrl: { type: string, format: uri }
                  key: { type: string, examples: ['furnixa/production/avatars/6627a1b2c3d4e5f6a7b8c9d0/3f2b8c1e-0c4d-4a52-9d7e-1b2a3c4d5e6f.webp'] }
                  publicUrl: { type: string, format: uri, description: R2_PUBLIC_BASE_URL + "/" + key }
                  expiresIn: { type: integer, const: 300, description: Seconds }
        '401': { $ref: '#/components/responses/Error' }
        '422':
          description: UPLOAD_NOT_ALLOWED (type not jpeg/png/webp, or size over 2 MB) or VALIDATION_ERROR
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` (5 presigns per user per 15 minutes)" }
  /me/addresses:
    get:
      tags: [Me]
      summary: List addresses (PROF-02)
      description: Own addresses only, the default first, then newest first.
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Address' } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Me]
      summary: Add address (PROF-02)
      description: >-
        At most 10 addresses per user (409 `ADDRESS_LIMIT_REACHED`). The first address becomes the default
        automatically. `isDefault: true` unsets every other default of the user in the same transaction.
        Unknown fields are rejected (422).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } }
        '401': { $ref: '#/components/responses/Error' }
        '409':
          description: ADDRESS_LIMIT_REACHED — the user already has 10 addresses
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: OUT_OF_DELIVERY_AREA — cityCode is unknown or inactive (ADR-008); VALIDATION_ERROR for an invalid Saudi phone, bad length or unknown field
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /me/addresses/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Me]
      summary: Update address
      description: >-
        Partial update (any subset of the AddressInput fields, at least one). The city is re-checked only when
        `cityCode` is in the body. `isDefault: true` unsets every other default in the same transaction;
        `isDefault: false` on the current default is 422 VALIDATION_ERROR (set another address as default instead).
        Another user's address, a missing one and a malformed id all answer 404 NOT_FOUND.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddressPatch' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: NOT_FOUND — missing, malformed id, or owned by another user
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: OUT_OF_DELIVERY_AREA — cityCode is unknown or inactive (ADR-008); VALIDATION_ERROR for an invalid Saudi phone, unknown field or `isDefault: false` on the default
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      tags: [Me]
      summary: Delete address
      description: >-
        Hard delete (orders keep their own address snapshot). Deleting the default promotes the most recently
        updated remaining address; deleting the last address is allowed.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: NOT_FOUND — missing, malformed id, or owned by another user
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ---------------- CATALOG ----------------
  /categories:
    get:
      tags: [Catalog]
      security: []
      summary: Active categories tree (CAT-01)
      description: >-
        Roots with their active children nested one level in `children`, both sorted by `sortOrder` then `slug`.
        Inactive categories are omitted; an inactive parent hides its whole subtree (children are not re-rooted).
        `productCount` is not included here (admin list only).
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } }
  /products:
    get:
      tags: [Catalog]
      security: []
      summary: Published products with filters (PROD-01)
      description: >-
        Only PUBLISHED products. `q` (max 100 chars, 422 above) searches `searchText`: the query is lowercased,
        Arabic-normalised (diacritics/tatweel removed, أ/إ/آ→ا, ة→ه, ى→ي, Arabic-Indic digits→ASCII), regex
        characters are escaped, and matched with case-insensitive `contains`. `category` is a category slug and
        includes products of its direct sub-categories; an unknown slug returns an empty page (not 404).
        `material` matches case-insensitively (exact). `inStock=true` means stock > 0. Category `isActive`
        does not hide products (it affects navigation only, T-009). Sort `featured` = isFeatured desc, then
        newest; default `newest`. Prices are halalas, min/max inclusive (owner decisions 2026-11-22, T-010).
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, description: category slug (includes its sub-categories' products), schema: { type: string } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ProductType' } }
        - { name: condition, in: query, schema: { type: array, items: { $ref: '#/components/schemas/Condition' } }, style: form, explode: false }
        - { name: minPrice, in: query, schema: { type: integer } }
        - { name: maxPrice, in: query, schema: { type: integer } }
        - { name: material, in: query, schema: { type: string } }
        - { name: inStock, in: query, schema: { type: boolean } }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc, featured], default: newest } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } }
  /products/{slug}:
    get:
      tags: [Catalog]
      security: []
      summary: Product detail + related (PROD-02)
      description: >-
        Only a PUBLISHED product resolves; DRAFT, ARCHIVED and unknown slugs -> 404. `related` holds up to 8
        PUBLISHED products of the same category, excluding the product itself, newest first (owner 2026-11-22).
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: '#/components/schemas/Product' }
                  related: { type: array, items: { $ref: '#/components/schemas/Product' } }
        '404': { $ref: '#/components/responses/Error' }

  # ---------------- CMS (public) ----------------
  /cms/home:
    get:
      tags: [CMS]
      security: []
      summary: Active banners + visible sections with resolved products (ADM-06, ADM-07)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  banners: { type: array, items: { $ref: '#/components/schemas/Banner' } }
                  sections:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/HomeSection'
                        - type: object
                          properties:
                            products: { type: array, items: { $ref: '#/components/schemas/Product' } }
                            categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
  /cms/settings:
    get:
      tags: [CMS]
      security: []
      summary: Public site settings (ADM-09). `deliveryCities` contains active cities only (ADM-13)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SiteSetting' } } }
  /cms/pages/{slug}:
    get:
      tags: [CMS]
      security: []
      summary: Published static page (ADM-08)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } }
        '404': { $ref: '#/components/responses/Error' }

  # ---------------- CART ----------------
  /cart:
    get:
      tags: [Cart]
      summary: Current cart with live prices, delivery fee and VAT (CART-01, ADR-009)
      parameters:
        - name: addressId
          in: query
          required: false
          description: When given, the delivery fee uses that address's city (override or default); otherwise the default fee.
          schema: { $ref: '#/components/schemas/ObjectId' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } }
  /cart/items:
    put:
      tags: [Cart]
      summary: Set quantity for a product (0 removes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, qty]
              properties:
                productId: { $ref: '#/components/schemas/ObjectId' }
                qty: { type: integer, minimum: 0 }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } }
        '409': { $ref: '#/components/responses/Error' }
  /cart/merge:
    post:
      tags: [Cart]
      summary: Merge guest cart after login (CART-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productId: { $ref: '#/components/schemas/ObjectId' }
                      qty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } }

  # ---------------- ORDERS ----------------
  /orders:
    post:
      tags: [Orders]
      summary: Place COD order from cart (ORD-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addressId]
              properties:
                addressId: { $ref: '#/components/schemas/ObjectId' }
                customerNote: { type: string, maxLength: 500 }
                expectedTotal: { type: integer, description: Total (halalas) the customer saw; if it differs from the server total the order is rejected with PRICE_CHANGED (ADR-009) }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '409':
          description: OUT_OF_STOCK / PRICE_CHANGED (item price, delivery fee, VAT or total differs from what the customer saw) / CART_EMPTY with per-item details
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: OUT_OF_DELIVERY_AREA — address city is unknown or inactive (ADR-008)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    get:
      tags: [Orders]
      summary: My orders (ORD-02)
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } }
  /orders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Orders]
      summary: My order detail (ORD-02)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '404': { $ref: '#/components/responses/Error' }
  /orders/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Orders]
      summary: Cancel own PENDING order (ORD-03)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '409':
          description: INVALID_TRANSITION — order is not PENDING
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ---------------- INTERNAL (Vercel Cron, ADR-012) ----------------
  /internal/cron/cleanup:
    servers: [{ url: 'http://localhost:4100' }]   # not under /api/v1
    get:
      tags: [Internal]
      summary: Cleanup job called by Vercel Cron (daily). Also accepts POST for manual runs.
      description: >
        Deletes expired or consumed OTPs, expired or revoked refresh tokens and Socket.IO adapter documents older than
        SOCKET_ADAPTER_TTL_SECONDS. Authenticated by `Authorization: Bearer CRON_SECRET` (what Vercel Cron sends) or header
        `x-cron-secret: CRON_SECRET`; not available to bearer JWTs. Idempotent. Not mounted when CRON_SECRET is unset.
      security: [{ cronBearer: [] }, { cronHeader: [] }]
      responses:
        '200':
          description: Counts of removed documents
          content:
            application/json:
              schema:
                type: object
                required: [otps, refreshTokens, socketEvents]
                properties:
                  otps: { type: integer }
                  refreshTokens: { type: integer }
                  socketEvents: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Internal]
      summary: Same as GET (manual run)
      security: [{ cronBearer: [] }, { cronHeader: [] }]
      responses:
        '200': { description: Counts of removed documents }
        '401': { $ref: '#/components/responses/Error' }

  # ---------------- NOTIFICATIONS ----------------
  /notifications:
    get:
      tags: [Notifications]
      summary: My notifications (NOTIF-03)
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
                  unread: { type: integer }
  /notifications/{id}/read:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Notifications]
      summary: Mark one as read
      responses:
        '204': { description: OK }
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all as read
      responses:
        '204': { description: OK }

  # ---------------- ADMIN ----------------
  /admin/dashboard/summary:
    get:
      tags: [Admin]
      summary: KPIs, 30-day order series, latest orders, low stock (ADM-01)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  todayOrders: { type: integer }
                  pendingOrders: { type: integer }
                  monthRevenue: { type: integer }
                  lowStockCount: { type: integer }
                  ordersByDay: { type: array, items: { type: object, properties: { date: { type: string, format: date }, count: { type: integer } } } }
                  latestOrders: { type: array, items: { $ref: '#/components/schemas/Order' } }
  /admin/uploads/presign:
    post:
      tags: [Admin]
      summary: Get a presigned PUT URL to upload an image straight to Cloudflare R2 (ADR-010)
      description: |
        Admin only. The browser then PUTs the file to `uploadUrl` with the same `Content-Type` and the signed size.
        Save the returned `key` (not the URL) on the product/banner. Allowed: image/jpeg, image/png, image/webp, max 5 MB.
        Key format: `furnixa/{env}/{yyyy}/{mm}/{uuid}.{ext}`. Required bucket CORS rule: see integrations.md.
        Each call records an `Upload` row (data-model.md); saves that add the key must attach it (the object must exist with the approved type and size, otherwise 422 `UPLOAD_NOT_ALLOWED` on the saving route). SVG is never allowed.
        Limit: 30 presigns per admin per 10 minutes (429 `RATE_LIMITED`, `Retry-After`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType, size]
              properties:
                fileName: { type: string, maxLength: 255, description: Informational only; never used in the key }
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                size: { type: integer, minimum: 1, maximum: 5242880, description: Bytes }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [uploadUrl, key, publicUrl, expiresIn]
                properties:
                  uploadUrl: { type: string, format: uri }
                  key: { type: string, examples: ['furnixa/production/2026/11/3f2b8c1e-0c4d-4a52-9d7e-1b2a3c4d5e6f.webp'] }
                  publicUrl: { type: string, format: uri, description: R2_PUBLIC_BASE_URL + "/" + key }
                  expiresIn: { type: integer, const: 300, description: Seconds }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` (30 presigns per admin per 10 minutes)" }
        '422':
          description: UPLOAD_NOT_ALLOWED (type not jpeg/png/webp, or size over 5 MB) or VALIDATION_ERROR
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /admin/products:
    get:
      tags: [Admin]
      summary: All products incl. drafts (ADM-02)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProductStatus' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ProductType' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } }
    post:
      tags: [Admin]
      summary: Create product
      description: >-
        Images carry only `key` (+ optional `alt`); the server recomputes `url` and attaches the uploads
        (`syncImages`, scope admin). Rules (owner 2026-11-22, T-010): type NEW requires condition NEW; type
        RESALE requires LIKE_NEW/GOOD/FAIR; `compareAtPrice` > `price` when set; DRAFT needs at least one
        non-empty locale, PUBLISHED both locales, for title and description (I18N-02) -> 422 otherwise.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } }
        '409': { $ref: '#/components/responses/Error', description: "`SLUG_TAKEN`" }
        '422': { $ref: '#/components/responses/Error', description: "`VALIDATION_ERROR` (incl. unknown categoryId, type/condition mismatch, publish gate) or `UPLOAD_NOT_ALLOWED`" }
  /admin/products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin]
      summary: Product by id
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Admin]
      summary: Update product (optimistic concurrency)
      description: >-
        Partial update; `expectedUpdatedAt` (the `updatedAt` the admin loaded) is required. The update is one
        conditional write (`where id AND updatedAt = expectedUpdatedAt`); when nothing matches the response is
        409 `STALE_UPDATE` with the current product in `details.current` and nothing is changed (owner
        2026-11-22, T-010). The create rules (type/condition, compareAtPrice, publish gate) apply to the merged
        result. Admin UI (T-064): on 409 STALE_UPDATE show "This product was changed, reload" and keep the edits.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductPatch' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error', description: "`SLUG_TAKEN` or `STALE_UPDATE` (current product in `details.current`)" }
        '422': { $ref: '#/components/responses/Error', description: "`VALIDATION_ERROR` or `UPLOAD_NOT_ALLOWED`" }
    delete:
      tags: [Admin]
      summary: Delete, or archive if referenced by orders
      description: >-
        Hard delete releases every image (R2 object + Upload row; a failed DeleteObject is logged, the request
        still succeeds). A product that appears in any order's items is archived instead (status ARCHIVED,
        images kept). An R2 object referenced by an order item's `imageKey` is never deleted (detach only).
      responses:
        '204': { description: Deleted or archived }
        '404': { $ref: '#/components/responses/Error' }
  /admin/categories:
    get:
      tags: [Admin]
      summary: All categories (ADM-03)
      description: Flat list (no `children`), including inactive, sorted by `sortOrder` then `slug`, each with `productCount` (products in any status, incl. ARCHIVED).
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Admin]
      summary: Create category (ADM-03)
      description: >-
        `image` takes an R2 `key` from `POST /admin/uploads/presign`; the server recomputes `url` and attaches the
        upload (scope `admin`): a key outside `furnixa/{env}/`, a missing object, or a type/size mismatch -> 422
        `UPLOAD_NOT_ALLOWED`. `parentId` must reference a root category (one level of sub-categories, CAT-01); a
        deeper parent or self-reference -> 422 `VALIDATION_ERROR`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error', description: "`SLUG_TAKEN` — another category already uses this slug" }
        '422':
          description: VALIDATION_ERROR (bad slug/name/parent, unknown field) or UPLOAD_NOT_ALLOWED (bad image key)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /admin/categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      summary: Update category (ADM-03)
      description: >-
        Partial update. Same image and parent rules as create; additionally, a category that has children cannot be
        given a parent (one level, 422). Replacing or removing (`image: null`) the image deletes the old R2 object
        after commit. Changing `slug` is allowed; uniqueness is enforced (409 `SLUG_TAKEN`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CategoryPatch' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: NOT_FOUND — missing or malformed id
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409': { $ref: '#/components/responses/Error', description: "`SLUG_TAKEN`" }
        '422':
          description: VALIDATION_ERROR (empty body, bad value, unknown field, depth rule) or UPLOAD_NOT_ALLOWED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      tags: [Admin]
      summary: Delete category (ADM-03)
      description: >-
        Hard delete; releases the category's image from R2 after commit (a failed R2 delete is logged, the request
        still succeeds). Refused while the category has products (any status, incl. ARCHIVED) or child categories.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: NOT_FOUND — missing or malformed id
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409': { $ref: '#/components/responses/Error', description: "`CATEGORY_HAS_PRODUCTS` or `CATEGORY_HAS_CHILDREN`" }
  /admin/orders:
    get:
      tags: [Admin]
      summary: All orders (ADM-04)
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: q, in: query, description: orderNo / customer email, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } }
  /admin/orders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin]
      summary: Order detail
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
  /admin/orders/{id}/status:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      summary: Transition status; 409 on invalid transition (ADM-04, NOTIF-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
                note: { type: string }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '409': { $ref: '#/components/responses/Error' }
  /admin/orders/{id}/note:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      summary: Set internal admin note
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { adminNote: { type: string } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
  /admin/customers:
    get:
      tags: [Admin]
      summary: Customers with order count (ADM-05)
      parameters: [{ name: q, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/User' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
  /admin/customers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin]
      summary: Customer detail with orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  orders: { type: array, items: { $ref: '#/components/schemas/Order' } }
  /admin/customers/{id}/block:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      summary: Block / unblock; blocking revokes refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [isBlocked], properties: { isBlocked: { type: boolean } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
  /admin/banners:
    get:
      tags: [Admin]
      summary: All banners (ADM-06)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Banner' } } } }
    post:
      tags: [Admin]
      summary: Create banner
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BannerInput' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Banner' } } }
  /admin/banners/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      summary: Update banner
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/BannerInput' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Banner' } } }
    delete:
      tags: [Admin]
      summary: Delete banner
      responses:
        '204': { description: Deleted }
  /admin/home-sections:
    get:
      tags: [Admin]
      summary: All sections ordered (ADM-07)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HomeSection' } } } }
    post:
      tags: [Admin]
      summary: Create section
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HomeSectionInput' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/HomeSection' } } }
  /admin/home-sections/reorder:
    put:
      tags: [Admin]
      summary: Set order by id list
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ids], properties: { ids: { type: array, items: { $ref: '#/components/schemas/ObjectId' } } } }
      responses:
        '204': { description: OK }
  /admin/home-sections/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      summary: Update section
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/HomeSectionInput' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/HomeSection' } } }
    delete:
      tags: [Admin]
      summary: Delete section
      responses:
        '204': { description: Deleted }
  /admin/pages:
    get:
      tags: [Admin]
      summary: All pages (ADM-08)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Page' } } } }
    post:
      tags: [Admin]
      summary: Create page
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PageInput' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } }
  /admin/pages/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      summary: Update page
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/PageInput' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } }
    delete:
      tags: [Admin]
      summary: Delete page
      responses:
        '204': { description: Deleted }
  /admin/settings:
    get:
      tags: [Admin]
      summary: Site settings (ADM-09)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SiteSetting' } } }
    put:
      tags: [Admin]
      summary: Replace site settings (incl. delivery cities, ADM-13)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SiteSetting' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SiteSetting' } } }
        '409':
          description: CONFLICT — an existing city code was removed (deactivate it instead) or a code was changed
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: VALIDATION_ERROR — no active delivery city, duplicate city code, missing ar/en city name, negative fee, VAT rate outside 0–50%, or invalid VAT registration number
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /admin/admins:
    get:
      tags: [Admin]
      summary: List admins (ADM-11)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/User' } } } }
    post:
      tags: [Admin]
      summary: Invite admin (creates unverified ADMIN, emails OTP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName: { type: string, minLength: 1, maxLength: 40 }
                lastName: { type: string, minLength: 1, maxLength: 40 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    cronBearer: { type: http, scheme: bearer, description: CRON_SECRET (sent by Vercel Cron) }
    cronHeader: { type: apiKey, in: header, name: x-cron-secret }
  parameters:
    Id: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
    CsrfToken: { name: X-CSRF-Token, in: header, required: true, schema: { type: string }, description: Token from GET /auth/csrf }
  responses:
    Error:
      description: Error (always carries `requestId`, also sent as response header `x-request-id`)
      headers:
        x-request-id: { schema: { type: string } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: |
        Too many requests (NFR-01). Error code `RATE_LIMITED`. Counters live in MongoDB (shared by all instances), fixed window per key. `Retry-After` is the number of seconds until the window resets; `RateLimit` is the IETF draft-7 structured header (`limit=<n>, remaining=<n>, reset=<seconds>`) and `RateLimit-Policy` its policy (`<n>;w=<window seconds>`). The same `RateLimit` headers are also sent on successful responses of rate-limited routes. If the counter store is unavailable the request is allowed (fail open) and the error is logged.
      headers:
        x-request-id: { schema: { type: string } }
        Retry-After: { schema: { type: integer, minimum: 0 }, description: Seconds until the window resets }
        RateLimit: { schema: { type: string, examples: ['limit=10, remaining=0, reset=840'] } }
        RateLimit-Policy: { schema: { type: string, examples: ['10;w=900'] } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Message:
      description: OK
      content:
        application/json:
          schema: { type: object, properties: { message: { type: string } } }
    AuthSession:
      description: Access token + user; sets `fx_rt` httpOnly refresh cookie
      headers:
        Set-Cookie: { schema: { type: string } }
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken: { type: string }
              user: { $ref: '#/components/schemas/User' }
  schemas:
    ObjectId: { type: string, pattern: '^[a-f0-9]{24}$' }
    Locale: { type: string, enum: [ar, en], default: ar }
    SaudiPhoneInput:
      type: string
      maxLength: 25
      x-canonical-pattern: '^(\+966|00966|0)?5[0-9]{8}$'
      description: >-
        Saudi mobile number (ADR-008). Input longer than 25 characters is rejected before anything else.
        Normalisation steps, in order: (1) trim; (2) convert Arabic-Indic (٠-٩) and Extended Arabic-Indic (۰-۹)
        digits to ASCII 0-9; (3) remove spaces, dashes, dots and parentheses; (4) the result must match
        `x-canonical-pattern` (`05XXXXXXXX`, `5XXXXXXXX`, `+9665XXXXXXXX` or `009665XXXXXXXX`). Anything else
        (letters, mixed scripts, landlines, wrong length) is VALIDATION_ERROR. The stored and returned value is
        always `+9665XXXXXXXX` (SaudiPhone). Clients must apply the same normalisation and then the same pattern.
        The pattern is in `x-canonical-pattern` (not `pattern`) because it applies after normalisation, not to the raw input.
      examples: ['0551234567', '055 123 4567', '+966-55-123-4567', '٠٥٥١٢٣٤٥٦٧']
    SaudiPhone:
      type: string
      pattern: '^\+9665[0-9]{8}$'
      description: Normalized E.164 Saudi mobile number returned by the API.
      examples: ['+966551234567']
    DeliveryCity:
      type: object
      required: [code, name, isActive, sortOrder]
      properties:
        code: { type: string, pattern: '^[a-z0-9-]+$', description: Unique, immutable slug (e.g. riyadh) }
        name: { $ref: '#/components/schemas/LocalizedText' }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        deliveryFee: { type: [integer, 'null'], minimum: 0, description: Optional admin-set per-city fee override in halalas; null = use the base deliveryFee, and if that is unset, 0 (ADR-009) }
    VatSetting:
      type: object
      required: [vatRate, applyToDelivery, pricesIncludeVat]
      properties:
        vatRate: { type: number, minimum: 0, maximum: 50, multipleOf: 0.01, default: 0, description: 'VAT percentage, e.g. 15 = 15%. 0 (default) means no VAT line anywhere.' }
        applyToDelivery: { type: boolean, default: true, description: 'Apply VAT to the delivery fee; only effective when vatRate > 0' }
        pricesIncludeVat: { type: boolean, default: true }
        registrationNumber: { type: [string, 'null'], pattern: '^3[0-9]{13}3$', description: 15-digit VAT registration number, printed on invoices }
    OrderVat:
      type: object
      description: Immutable snapshot taken at order placement (ADR-009)
      required: [vatRate, vatAmount, applyToDelivery, pricesIncludeVat]
      properties:
        vatRate: { type: number }
        vatAmount: { type: integer, description: VAT amount in halalas (0 when vatRate is 0) }
        applyToDelivery: { type: boolean }
        pricesIncludeVat: { type: boolean }
        registrationNumber: { type: [string, 'null'] }
    Role: { type: string, enum: [ADMIN, CUSTOMER] }
    OtpPurpose: { type: string, enum: [VERIFY_EMAIL, RESET_PASSWORD] }
    ProductType: { type: string, enum: [NEW, RESALE] }
    Condition: { type: string, enum: [NEW, LIKE_NEW, GOOD, FAIR] }
    ProductStatus: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
    OrderStatus: { type: string, enum: [PENDING, CONFIRMED, PROCESSING, OUT_FOR_DELIVERY, DELIVERED, CANCELLED] }
    SectionType: { type: string, enum: [FEATURED_PRODUCTS, NEW_ARRIVALS, RESALE_PICKS, CATEGORY_GRID, PROMO_BANNER, TESTIMONIALS] }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [VALIDATION_ERROR, BAD_REQUEST, PAYLOAD_TOO_LARGE, INTERNAL_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, OUT_OF_STOCK, RATE_LIMITED, OTP_INVALID, OTP_EXPIRED, EMAIL_IN_USE, EMAIL_NOT_VERIFIED, ACCOUNT_BLOCKED, ACCOUNT_LOCKED, INVALID_CREDENTIALS, REFRESH_RACE, CSRF_INVALID, UPLOAD_NOT_ALLOWED, INVALID_TRANSITION, OUT_OF_DELIVERY_AREA, ADDRESS_LIMIT_REACHED, SLUG_TAKEN, CATEGORY_HAS_PRODUCTS, CATEGORY_HAS_CHILDREN, STALE_UPDATE] }
        message: { type: string, description: "English only, for logs and developers. Clients must not display it; they localise by `code` (en/ar message catalogues, generic fallback)." }
        details: {}
        requestId: { type: string }
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    LocalizedText:
      type: object
      required: [en, ar]
      properties:
        en: { type: string }
        ar: { type: string }
    ImageAsset:
      type: object
      required: [key, url]
      description: Stored image. In request bodies only `key` is trusted; the server recomputes `url` from `key` (R2_PUBLIC_BASE_URL + "/" + key) and rejects keys outside `furnixa/{env}/`.
      properties:
        key: { type: string, description: R2 object key, examples: ['furnixa/production/2026/11/3f2b8c1e-0c4d-4a52-9d7e-1b2a3c4d5e6f.webp'] }
        url: { type: string, format: uri }
        alt: { $ref: '#/components/schemas/LocalizedText' }
        width: { type: integer }
        height: { type: integer }
    ImageAssetInput:
      type: object
      additionalProperties: false
      required: [key]
      description: >-
        Image in a request body: only the R2 `key` (from the presign route) plus optional `alt`. The server
        recomputes `url` from `key`; a sent `url` is rejected (unknown field). Keys outside `furnixa/{env}/` or
        without a matching unattached `Upload` row -> 422 `UPLOAD_NOT_ALLOWED`.
      properties:
        key: { type: string, description: R2 object key, examples: ['furnixa/production/2026/11/3f2b8c1e-0c4d-4a52-9d7e-1b2a3c4d5e6f.webp'] }
        alt: { $ref: '#/components/schemas/LocalizedText' }
    User:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        phone: { oneOf: [{ $ref: '#/components/schemas/SaudiPhone' }, { type: 'null' }] }
        avatarUrl: { type: [string, 'null'], description: "R2_PUBLIC_BASE_URL/key, or null; computed from the stored key" }
        isVerified: { type: boolean }
        isBlocked: { type: boolean }
        preferredLocale: { $ref: '#/components/schemas/Locale' }
        createdAt: { type: string, format: date-time }
    AddressInput:
      type: object
      additionalProperties: false
      required: [label, fullName, phone, cityCode, area, street]
      properties:
        label: { type: string, minLength: 1, maxLength: 30 }
        fullName: { type: string, minLength: 1, maxLength: 80 }
        phone: { $ref: '#/components/schemas/SaudiPhoneInput' }
        cityCode: { type: string, description: Code of an active DeliveryCity from /cms/settings (ADR-008); stored in its canonical form }
        area: { type: string, minLength: 1, maxLength: 80 }
        street: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: string, maxLength: 300 }
        isDefault: { type: boolean }
    AddressPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Any subset of AddressInput (same limits).
      properties:
        label: { type: string, minLength: 1, maxLength: 30 }
        fullName: { type: string, minLength: 1, maxLength: 80 }
        phone: { $ref: '#/components/schemas/SaudiPhoneInput' }
        cityCode: { type: string }
        area: { type: string, minLength: 1, maxLength: 80 }
        street: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: string, maxLength: 300 }
        isDefault: { type: boolean }
    Address:
      type: object
      required: [id, label, fullName, phone, cityCode, area, street, isDefault, isDeliverable]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        label: { type: string, minLength: 1, maxLength: 30 }
        fullName: { type: string, minLength: 1, maxLength: 80 }
        phone: { $ref: '#/components/schemas/SaudiPhone' }
        cityCode: { type: string }
        area: { type: string, minLength: 1, maxLength: 80 }
        street: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: [string, 'null'], maxLength: 300 }
        isDefault: { type: boolean }
        isDeliverable:
          type: boolean
          readOnly: true
          description: >-
            True only when `cityCode` is an active city in `SiteSetting.deliveryCities` at the time of the request
            (read per request, no cache; compared trimmed and lowercased like `assertActiveCity`). A saved address
            whose city was deactivated later returns false and stays editable. Clients show "Not deliverable" from this
            field; checkout still re-checks the city on the server (422 OUT_OF_DELIVERY_AREA).
    CategoryName:
      type: object
      required: [en, ar]
      description: Localized category name; both locales required (I18N-02), trimmed, 1-60 chars each.
      properties:
        en: { type: string, minLength: 1, maxLength: 60 }
        ar: { type: string, minLength: 1, maxLength: 60 }
    CategoryInput:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { $ref: '#/components/schemas/CategoryName' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 60 }
        image: { oneOf: [{ $ref: '#/components/schemas/ImageAssetInput' }, { type: 'null' }] }
        parentId: { type: [string, 'null'], description: Id of a ROOT category (one level of nesting, CAT-01) or null }
        sortOrder: { type: integer, minimum: 0, default: 0 }
        isActive: { type: boolean, default: true }
    CategoryPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Any subset of CategoryInput (same limits).
      properties:
        name: { $ref: '#/components/schemas/CategoryName' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 60 }
        image: { oneOf: [{ $ref: '#/components/schemas/ImageAssetInput' }, { type: 'null' }] }
        parentId: { type: [string, 'null'] }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
    Category:
      type: object
      required: [id, name, slug, parentId, sortOrder, isActive]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        name: { $ref: '#/components/schemas/CategoryName' }
        slug: { type: string }
        image: { oneOf: [{ $ref: '#/components/schemas/ImageAsset' }, { type: 'null' }] }
        parentId: { type: [string, 'null'] }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        children:
          type: array
          items: { $ref: '#/components/schemas/Category' }
          description: Only in the public tree (GET /categories), one level deep.
        productCount:
          type: integer
          readOnly: true
          description: Only in the admin list (GET /admin/categories); products in any status, incl. ARCHIVED.
    Dimensions:
      type: object
      properties:
        widthCm: { type: number }
        depthCm: { type: number }
        heightCm: { type: number }
        weightKg: { type: number }
    ProductTitle:
      type: object
      required: [en, ar]
      description: >-
        Localized, each locale ≤ 120 chars. DRAFT requires at least one non-empty locale; PUBLISHED requires
        both non-empty (trimmed; I18N-02, owner 2026-11-22).
      properties:
        en: { type: string, maxLength: 120 }
        ar: { type: string, maxLength: 120 }
    ProductDescription:
      type: object
      required: [en, ar]
      description: Same locale rules as ProductTitle; each locale ≤ 5000 chars.
      properties:
        en: { type: string, maxLength: 5000 }
        ar: { type: string, maxLength: 5000 }
    ProductInput:
      type: object
      additionalProperties: false
      required: [title, description, slug, type, condition, price, stock, categoryId]
      description: >-
        Limits (owner 2026-11-22, T-010): price/compareAtPrice 0..100000000 halalas (1,000,000 SAR),
        `compareAtPrice` > `price` when set, stock 0..100000. Type NEW ⇔ condition NEW; RESALE ⇔
        LIKE_NEW/GOOD/FAIR. Image keys must be distinct.
      properties:
        title: { $ref: '#/components/schemas/ProductTitle' }
        description: { $ref: '#/components/schemas/ProductDescription' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 60 }
        sku: { type: [string, 'null'], minLength: 1, maxLength: 40 }
        type: { $ref: '#/components/schemas/ProductType' }
        condition: { $ref: '#/components/schemas/Condition' }
        conditionNotes: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }], description: '≤ 1000 chars per locale' }
        price: { type: integer, minimum: 0, maximum: 100000000, description: halalas }
        compareAtPrice: { type: [integer, 'null'], minimum: 0, maximum: 100000000, description: must be greater than price when set }
        stock: { type: integer, minimum: 0, maximum: 100000 }
        categoryId: { $ref: '#/components/schemas/ObjectId' }
        images: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/ImageAssetInput' } }
        dimensions: { oneOf: [{ $ref: '#/components/schemas/Dimensions' }, { type: 'null' }] }
        material: { type: [string, 'null'], minLength: 1, maxLength: 60 }
        color: { type: [string, 'null'], minLength: 1, maxLength: 60 }
        isFeatured: { type: boolean, default: false }
        status: { $ref: '#/components/schemas/ProductStatus' }
    ProductPatch:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [expectedUpdatedAt]
      description: >-
        Any subset of ProductInput (same limits) plus the required `expectedUpdatedAt` and at least one field to
        change. Rules are enforced on the merged result.
      properties:
        expectedUpdatedAt: { type: string, format: date-time, description: The `updatedAt` the admin loaded; mismatch -> 409 STALE_UPDATE }
        title: { $ref: '#/components/schemas/ProductTitle' }
        description: { $ref: '#/components/schemas/ProductDescription' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 60 }
        sku: { type: [string, 'null'], minLength: 1, maxLength: 40 }
        type: { $ref: '#/components/schemas/ProductType' }
        condition: { $ref: '#/components/schemas/Condition' }
        conditionNotes: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        price: { type: integer, minimum: 0, maximum: 100000000 }
        compareAtPrice: { type: [integer, 'null'], minimum: 0, maximum: 100000000 }
        stock: { type: integer, minimum: 0, maximum: 100000 }
        categoryId: { $ref: '#/components/schemas/ObjectId' }
        images: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/ImageAssetInput' } }
        dimensions: { oneOf: [{ $ref: '#/components/schemas/Dimensions' }, { type: 'null' }] }
        material: { type: [string, 'null'], minLength: 1, maxLength: 60 }
        color: { type: [string, 'null'], minLength: 1, maxLength: 60 }
        isFeatured: { type: boolean }
        status: { $ref: '#/components/schemas/ProductStatus' }
    Product:
      type: object
      required: [id, title, description, slug, type, condition, price, stock, categoryId, images, isFeatured, status, createdAt, updatedAt]
      description: Stored images carry the server-computed `url`. `searchText` is internal and never returned.
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        title: { $ref: '#/components/schemas/ProductTitle' }
        description: { $ref: '#/components/schemas/ProductDescription' }
        slug: { type: string }
        sku: { type: [string, 'null'] }
        type: { $ref: '#/components/schemas/ProductType' }
        condition: { $ref: '#/components/schemas/Condition' }
        conditionNotes: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        price: { type: integer, description: halalas }
        compareAtPrice: { type: [integer, 'null'] }
        stock: { type: integer }
        categoryId: { $ref: '#/components/schemas/ObjectId' }
        category: { $ref: '#/components/schemas/Category' }
        images: { type: array, items: { $ref: '#/components/schemas/ImageAsset' } }
        dimensions: { oneOf: [{ $ref: '#/components/schemas/Dimensions' }, { type: 'null' }] }
        material: { type: [string, 'null'] }
        color: { type: [string, 'null'] }
        isFeatured: { type: boolean }
        status: { $ref: '#/components/schemas/ProductStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: Send back as `expectedUpdatedAt` on PATCH }
    ProductPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              product: { $ref: '#/components/schemas/Product' }
              qty: { type: integer }
              lineTotal: { type: integer }
              issue: { type: [string, 'null'], enum: [OUT_OF_STOCK, QTY_REDUCED, UNAVAILABLE, null] }
        subtotal: { type: integer }
        deliveryFee: { type: integer, description: 'Resolved fee in halalas; 0 renders as "Free delivery"' }
        vat: { $ref: '#/components/schemas/OrderVat' }
        total: { type: integer, description: 'subtotal + deliveryFee, plus vat.vatAmount when prices exclude VAT' }
    StatusEvent:
      type: object
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        at: { type: string, format: date-time }
        byUserId: { $ref: '#/components/schemas/ObjectId' }
        note: { type: string }
    Order:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        orderNo: { type: string, examples: [FX-20261120-0042] }
        user: { $ref: '#/components/schemas/User' }
        items:
          type: array
          items:
            type: object
            properties:
              productId: { $ref: '#/components/schemas/ObjectId' }
              titleSnapshot: { $ref: '#/components/schemas/LocalizedText' }
              imageSnapshot: { type: string }
              unitPrice: { type: integer }
              qty: { type: integer }
              type: { $ref: '#/components/schemas/ProductType' }
              condition: { $ref: '#/components/schemas/Condition' }
        address: { $ref: '#/components/schemas/AddressInput' }
        subtotal: { type: integer }
        deliveryFee: { type: integer, description: Snapshot of the fee resolved at placement (free threshold, city override, base fee, else 0) }
        vat: { $ref: '#/components/schemas/OrderVat' }
        total: { type: integer, description: 'subtotal + deliveryFee, plus vat.vatAmount when prices exclude VAT' }
        paymentMethod: { type: string, enum: [COD] }
        paymentStatus: { type: string, enum: [UNPAID, PAID] }
        status: { $ref: '#/components/schemas/OrderStatus' }
        statusHistory: { type: array, items: { $ref: '#/components/schemas/StatusEvent' } }
        customerNote: { type: [string, 'null'] }
        adminNote: { type: [string, 'null'], description: admin responses only }
        createdAt: { type: string, format: date-time }
    OrderPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    Notification:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        type: { type: string, enum: [ORDER_PLACED, ORDER_STATUS, NEW_ORDER, SYSTEM] }
        title: { $ref: '#/components/schemas/LocalizedText' }
        body: { $ref: '#/components/schemas/LocalizedText' }
        link: { type: [string, 'null'] }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    BannerInput:
      type: object
      required: [title, imageDesktop]
      properties:
        title: { $ref: '#/components/schemas/LocalizedText' }
        subtitle: { $ref: '#/components/schemas/LocalizedText' }
        ctaLabel: { $ref: '#/components/schemas/LocalizedText' }
        ctaHref: { type: string }
        imageDesktop: { $ref: '#/components/schemas/ImageAsset' }
        imageMobile: { $ref: '#/components/schemas/ImageAsset' }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    Banner:
      allOf:
        - $ref: '#/components/schemas/BannerInput'
        - type: object
          properties:
            id: { $ref: '#/components/schemas/ObjectId' }
    HomeSectionInput:
      type: object
      required: [type, title]
      properties:
        type: { $ref: '#/components/schemas/SectionType' }
        title: { $ref: '#/components/schemas/LocalizedText' }
        subtitle: { $ref: '#/components/schemas/LocalizedText' }
        config:
          type: object
          properties:
            productIds: { type: array, items: { $ref: '#/components/schemas/ObjectId' } }
            categoryIds: { type: array, items: { $ref: '#/components/schemas/ObjectId' } }
            limit: { type: integer, maximum: 24 }
            bannerId: { $ref: '#/components/schemas/ObjectId' }
            testimonials:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  quote: { $ref: '#/components/schemas/LocalizedText' }
        sortOrder: { type: integer }
        isVisible: { type: boolean }
    HomeSection:
      allOf:
        - $ref: '#/components/schemas/HomeSectionInput'
        - type: object
          properties:
            id: { $ref: '#/components/schemas/ObjectId' }
    PageInput:
      type: object
      required: [slug, title, content]
      properties:
        slug: { type: string }
        title: { $ref: '#/components/schemas/LocalizedText' }
        content: { $ref: '#/components/schemas/LocalizedText' }
        metaTitle: { $ref: '#/components/schemas/LocalizedText' }
        metaDescription: { $ref: '#/components/schemas/LocalizedText' }
        isPublished: { type: boolean }
    Page:
      allOf:
        - $ref: '#/components/schemas/PageInput'
        - type: object
          properties:
            id: { $ref: '#/components/schemas/ObjectId' }
            updatedAt: { type: string, format: date-time }
    SiteSetting:
      type: object
      properties:
        storeName: { $ref: '#/components/schemas/LocalizedText' }
        logo: { $ref: '#/components/schemas/ImageAsset' }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string, description: Free text; the store may list a landline }
        address: { $ref: '#/components/schemas/LocalizedText' }
        socials:
          type: object
          properties:
            facebook: { type: string }
            instagram: { type: string }
            whatsapp: { type: string }
            tiktok: { type: string }
        deliveryFee: { type: integer, minimum: 0, default: 0, description: Base delivery fee in halalas; 0 = free delivery (ADR-009) }
        freeDeliveryThreshold: { type: [integer, 'null'], minimum: 0, default: null, description: Optional. Subtotal (halalas) at or above which delivery is free; null = no threshold }
        vat: { $ref: '#/components/schemas/VatSetting' }
        currency: { type: string, const: SAR, description: ISO 4217; fixed to SAR (ADR-008) }
        deliveryCities:
          type: array
          description: Delivery cities (ADM-13). Public endpoint returns active cities only; admin endpoint returns all.
          items: { $ref: '#/components/schemas/DeliveryCity' }
        defaultLocale: { $ref: '#/components/schemas/Locale' }
        seo:
          type: object
          properties:
            title: { $ref: '#/components/schemas/LocalizedText' }
            description: { $ref: '#/components/schemas/LocalizedText' }
