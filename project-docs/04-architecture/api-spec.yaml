openapi: 3.1.0
info:
  title: Furnixa API
  version: 0.1.0
  description: |
    REST API for the Furnixa furniture marketplace (website + admin).
    Base path /api/v1. Auth: Bearer access token (JWT). Refresh token in cookie `fx_rt` (30 days): `HttpOnly`, `Secure` from env `AUTH_COOKIE_SECURE`, `SameSite` from env `AUTH_COOKIE_SAME_SITE`, `Path=/api/v1/auth` (so it is only sent to the auth routes), optional `Domain` from `AUTH_COOKIE_DOMAIN`. Cookie-authenticated calls (`/auth/refresh`, `/auth/logout`) also need header `X-CSRF-Token` from `GET /auth/csrf` (ADR-011).
    Access token JWT: HS256 only, `iss` = `furnixa-api`, `aud` = `furnixa`, claims `sub` (user id), `role`, `jti`; all verified on every request. The server loads the user from the database on every authenticated request (401 if missing or blocked) and takes `role` from the database, not from the token. Refresh is rotating with a 10 s grace window: a just-rotated token presented again within 10 s gets 401 `REFRESH_RACE` (nothing revoked; retry with the new cookie), after that the session family is revoked. Clients must make refresh single-flight.
    All error responses use the Error schema. Locale for emails/messages via `Accept-Language: ar|en` (default `ar`).
    Prices are integer halalas (1 SAR = 100 halalas). Phone numbers are Saudi mobile numbers, returned as E.164 `+9665XXXXXXXX`.
servers:
  - url: http://localhost:1000/api/v1
tags:
  - name: Auth
  - name: Me
  - name: Catalog
  - name: CMS
  - name: Cart
  - name: Wishlist
  - name: Orders
  - name: Notifications
  - name: Admin
  - name: Internal
  - name: System
security:
  - bearerAuth: []

paths:
  # ---------------- SYSTEM ----------------
  /health:
    get:
      tags: [System]
      summary: Liveness check (served at the host root, not under /api/v1)
      servers:
        - url: http://localhost:1000
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  # ---------------- AUTH ----------------
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register and send email OTP (AUTH-01)
      description: |
        Email is trimmed and lower-cased. Password: 8-128 characters, at least one letter and one number.
        The OTP email is sent in the locale of `Accept-Language` (`ar`|`en`), else `preferredLocale`, else `ar`.
        Registering an email that already has an **unverified** account never changes that account: the submitted
        data (password hash, names, locale) is stored on the new OTP row and applied only when *that* OTP is verified
        (prevents pre-account takeover). Subject to the 60 s cooldown and the 5-per-hour OTP cap (429 `RATE_LIMITED`),
        and to a per-IP cap of 20 register requests per hour (T-019, NFR-01; all requests count).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName: { type: string, minLength: 1, maxLength: 40 }
                lastName: { type: string, minLength: 1, maxLength: 40 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128, description: At least one letter and one number }
                preferredLocale: { $ref: '#/components/schemas/Locale' }
      responses:
        '201': { $ref: '#/components/responses/Message' }
        '409': { $ref: '#/components/responses/Error', description: "`EMAIL_IN_USE` - the email belongs to a verified account" }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` - cooldown, hourly OTP cap, or the per-IP cap (20/hour)" }
  /auth/verify-otp:
    post:
      tags: [Auth]
      security: []
      summary: Verify email OTP and log in (AUTH-01)
      description: |
        Finds the unconsumed, unexpired VERIFY_EMAIL OTP whose code matches, applies that OTP's pending registration
        data to the user, marks the user verified, consumes **all** VERIFY_EMAIL OTPs of the email, and returns an
        access token plus the `fx_rt` cookie. Wrong codes are counted per email across all its VERIFY_EMAIL OTPs; the
        5th wrong code invalidates all of them. Errors (400): `OTP_INVALID` wrong code; `OTP_EXPIRED` expired,
        invalidated, already used, or no OTP.
        **IP limit** (T-019, NFR-01): 10 failed attempts per 15 min per IP (successful verifications are not
        counted), so codes cannot be guessed by rotating across emails -> 429 `RATE_LIMITED` with `Retry-After`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '400': { $ref: '#/components/responses/Error', description: "`OTP_INVALID` or `OTP_EXPIRED`" }
        '403': { $ref: '#/components/responses/Error', description: "`ACCOUNT_BLOCKED`" }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` (per-IP limit on failed attempts)" }
  /auth/resend-otp:
    post:
      tags: [Auth]
      security: []
      summary: Resend OTP (AUTH-04)
      description: |
        Always answers the same 200 message for known and unknown emails (no email is sent for unknown ones or for
        a purpose that does not apply to the account). The 60 s cooldown and the 5-per-hour cap apply per email and
        purpose, also for unknown emails, so 429 does not reveal whether an account exists. A per-IP cap of
        20 requests per hour (T-019, NFR-01; all requests count) stops mass mail across many different emails.

        **VERIFY_EMAIL requires `password`** (AUTH-01, closes the resend race). The server looks for the unexpired
        VERIFY_EMAIL OTP row of the email (also one burnt by the 5-wrong-codes lockout) whose `pendingRegistration.passwordHash` matches the password
        (argon2 verify) and binds the new OTP to that row's pending data only. If nothing matches (unknown email,
        wrong password, already verified, no live row) the response is the identical 200 and a decoy row is written,
        exactly as for an unknown email; the cooldown and hourly cap behave the same either way. A caller who does not
        know the password of a pending registration can therefore never obtain a code bound to it.
        **RESET_PASSWORD** stays `{email, purpose}`; `password` is ignored. `password` missing for VERIFY_EMAIL -> 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, purpose]
              properties:
                email: { type: string, format: email }
                purpose: { $ref: '#/components/schemas/OtpPurpose' }
                password: { type: string, minLength: 1, maxLength: 128, description: "Required when purpose is VERIFY_EMAIL; the password given at registration" }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` (OTP cooldown, hourly cap, or the per-IP cap)" }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: |
        Email + password login (AUTH-02). Order: per-IP limit -> email lockout check -> password check -> status checks.
        While an email is locked (LOGIN_MAX_FAILURES failures within LOGIN_LOCKOUT_SECONDS) every attempt gets 429 `ACCOUNT_LOCKED` WITHOUT checking the password, for known and unknown emails alike (no password oracle); `Retry-After` is set.
        An unknown email and a wrong password both give the identical 401 `INVALID_CREDENTIALS`. `EMAIL_NOT_VERIFIED` and `ACCOUNT_BLOCKED` are returned only after the password verified.
        For an unverified account the password is matched against its pending registrations (same rule as resend-otp), the new OTP is bound to the matching one and sent, and the response is 403 `EMAIL_NOT_VERIFIED` (if the OTP cooldown or cap blocks the mail it is not sent, the response is the same).
        The per-IP limit (10 failed attempts / 15 min) does not count successful logins. The oldest session is revoked when MAX_ACTIVE_SESSIONS would be exceeded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Error', description: "`INVALID_CREDENTIALS` (unknown email or wrong password, identical body)" }
        '403':
          description: Blocked (`ACCOUNT_BLOCKED`), or unverified (`EMAIL_NOT_VERIFIED`, OTP re-sent); only after the password verified
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` (per-IP limit) or `ACCOUNT_LOCKED` (per-account lockout)" }
  /auth/csrf:
    get:
      tags: [Auth]
      security: []
      summary: Issue a CSRF token for cookie-authenticated requests (ADR-011). The token is HMAC(CSRF_SECRET, session familyId), so it stays valid across refresh rotations. Needs a valid refresh cookie.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [csrfToken], properties: { csrfToken: { type: string } } }
        '401': { $ref: '#/components/responses/Error', description: "`UNAUTHORIZED`: no valid refresh cookie" }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate refresh cookie, return new access token (AUTH-05). Requires X-CSRF-Token; a present `Origin` header must be in CORS_ALLOWED_ORIGINS (else 403 `CSRF_INVALID`).
      description: |
        **IP limit** (T-019, NFR-01): 20 failed attempts per 15 min per IP -> 429 `RATE_LIMITED` with `Retry-After`.
        Successful refreshes are not counted, and neither is 401 `REFRESH_RACE` (the multi-tab grace case is not a
        guessing attempt); only real failures (401 `UNAUTHORIZED`, 403 `CSRF_INVALID`) count.
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Error', description: "`UNAUTHORIZED` (missing, unknown, expired or revoked token, reuse after the grace window: the session family is revoked) or `REFRESH_RACE` (token rotated less than 10 s ago: retry with the new cookie, nothing revoked)" }
        '403': { description: CSRF_INVALID, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` (per-IP limit on failed attempts; `REFRESH_RACE` responses are not counted)" }
  /auth/logout:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }, {}]
      summary: Revoke the session (AUTH-05) and clear the cookie. With the refresh cookie present it requires X-CSRF-Token (and the Origin rule of /auth/refresh) and revokes the whole session family; with only a Bearer token there is no cookie to revoke and the call just succeeds.
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Error', description: "`UNAUTHORIZED`: neither a refresh cookie nor a valid Bearer token" }
        '403': { description: CSRF_INVALID, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      summary: Send reset OTP; always 200 (AUTH-03)
      description: |
        Same flow and limits as `POST /auth/resend-otp` with purpose `RESET_PASSWORD`: the identical 200 message for
        known and unknown emails (and for blocked or unverified accounts, which get no mail); the 60 s cooldown and
        the 5-per-hour cap apply per email, also for unknown emails, so a 429 does not reveal whether an account exists.
        A per-IP cap of 20 requests per hour (T-019, NFR-01; all requests count) stops mass mail across many emails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` (OTP cooldown, hourly cap, or the per-IP cap)" }
  /auth/reset-password:
    post:
      tags: [Auth]
      security: []
      summary: Reset password with OTP (AUTH-03)
      description: |
        Does **not** log the user in: it returns 200 `Message` and the user then logs in with the new password.

        **No enumeration.** Every failure to match a live `RESET_PASSWORD` code (unknown email, no live code, expired,
        already used, wrong code) is the identical 400 `OTP_INVALID` (so `OTP_EXPIRED` is never returned here), and each
        failure path spends one argon2 verify so timing matches. The 5th wrong code for an email burns every live code.
        `ACCOUNT_BLOCKED` (403) is returned only after a correct code.

        **On success, in one transaction:** the new argon2id hash and `User.passwordChangedAt` are stored, every
        refresh token of the user is revoked, every `RESET_PASSWORD` OTP of the email is consumed, and the login lockout
        (`User.failedLoginCount`, `lockedUntil` and the `login:email:<hmac>` rate-limit key) is cleared. Access tokens
        issued before or in the same second as `passwordChangedAt` are rejected with 401 `UNAUTHORIZED` (`iat <= floor(passwordChangedAt / 1000)`,
        `iat` has 1 s precision). A "Your password was changed" email (no code, no password) is then sent in the user's
        `preferredLocale`, in the background.

        **IP limit:** 10 failed attempts per 15 min per IP (successful resets do not count), so codes cannot be
        guessed across many emails; over the limit -> 429 `RATE_LIMITED` with `Retry-After`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^[0-9]{6}$' }
                newPassword: { type: string, minLength: 8, maxLength: 128, description: "At least one letter and one number (same rule as registration)" }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error', description: "`OTP_INVALID` (any failure to match a live code; see above)" }
        '403': { description: "`ACCOUNT_BLOCKED`, only after a correct code", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Error', description: "Validation error (malformed email or code, weak password); the code stays usable" }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` (per-IP limit on failed attempts)" }
  /auth/accept-invite:
    post:
      tags: [Auth]
      security: []
      summary: Accept an admin invite — set the password, verify, log in (ADM-11, T-017)
      description: |
        Completes an invite created by `POST /admin/admins`. The invitee chooses their own password here;
        the inviting admin never knows it (owner decision 2026-11-22).

        **No enumeration.** Every failure to match a live `INVITE_ADMIN` code (unknown email, no live code,
        expired — invites live `INVITE_TTL_SECONDS`, default 48 h —, already used, wrong code) is the identical
        400 `OTP_INVALID`, and each failure path spends one argon2 verify so timing matches. The 5th wrong code
        for an email burns every live code. `ACCOUNT_BLOCKED` (403) is returned only after a correct code.
        A weak password -> 422 and the code stays usable.

        **On success, in one transaction:** the chosen password's argon2id hash is stored, `isVerified` is set,
        and every `INVITE_ADMIN` OTP of the email is consumed. The invitee is logged in (same response shape as
        `/auth/verify-otp`: access token + `fx_rt` refresh cookie). `passwordChangedAt` is NOT set: this is the
        account's first password, no earlier session or token can exist (unverified users fail `requireAuth` and
        the pre-accept hash is unusable), and setting it would reject the access token issued in the same second.

        **IP limit:** 10 failed attempts per 15 min per IP (successes do not count) -> 429 `RATE_LIMITED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^[0-9]{6}$' }
                password: { type: string, minLength: 8, maxLength: 128, description: "At least one letter and one number (same rule as registration)" }
      responses:
        '200':
          description: Verified and logged in (sets the `fx_rt` refresh cookie, same flags as login)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Error', description: "`OTP_INVALID` (any failure to match a live code; see above)" }
        '403': { description: "`ACCOUNT_BLOCKED`, only after a correct code", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Error', description: "Validation error (malformed email or code, weak password); the code stays usable" }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` (per-IP limit on failed attempts)" }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '401': { $ref: '#/components/responses/Error' }

  # ---------------- ME ----------------
  /me:
    patch:
      tags: [Me]
      summary: Update profile (PROF-01)
      description: >-
        Partial update; unknown fields (email, role, isVerified, isBlocked, id, ...) are rejected with 422
        VALIDATION_ERROR and nothing changes. Strings are trimmed. `phone` is normalised to `+9665XXXXXXXX`;
        `null` clears it. `avatar` accepts an R2 key from `POST /me/avatar/presign` or `null` to remove it;
        a full URL is rejected with 422 `UPLOAD_NOT_ALLOWED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                firstName: { type: string, minLength: 1, maxLength: 40 }
                lastName: { type: string, minLength: 1, maxLength: 40 }
                phone: { oneOf: [{ $ref: '#/components/schemas/SaudiPhoneInput' }, { type: 'null' }] }
                preferredLocale: { $ref: '#/components/schemas/Locale' }
                avatar: { oneOf: [{ type: string, description: "R2 key from POST /me/avatar/presign" }, { type: 'null' }] }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '401': { $ref: '#/components/responses/Error' }
        '422':
          description: VALIDATION_ERROR (unknown field, invalid value or invalid Saudi phone) or UPLOAD_NOT_ALLOWED (invalid key, URL, wrong scope or key not belonging to this user)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /me/avatar/presign:
    post:
      tags: [Me]
      summary: Get a presigned PUT URL to upload an avatar to Cloudflare R2 (PROF-01)
      description: |
        Customer or admin. The browser then PUTs the file to `uploadUrl` with the same `Content-Type` and the signed
        `Content-Length`. Save the returned `key` and pass it to `PATCH /me` as `avatar`.
        Allowed: image/jpeg, image/png, image/webp; max 2 MB (2 097 152 bytes). SVG is never allowed.
        Key format: `furnixa/{env}/avatars/{userId}/{uuid}.{ext}`.
        Each call records an `Upload` row (scope `avatar`); the key may only be attached by the same user.
        Limit: 5 presigns per 15 minutes per user (429 `RATE_LIMITED`, `Retry-After`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, size]
              additionalProperties: false
              properties:
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                size: { type: integer, minimum: 1, maximum: 2097152, description: Bytes }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [uploadUrl, key, publicUrl, expiresIn]
                properties:
                  uploadUrl: { type: string, format: uri }
                  key: { type: string, examples: ['furnixa/production/avatars/6627a1b2c3d4e5f6a7b8c9d0/3f2b8c1e-0c4d-4a52-9d7e-1b2a3c4d5e6f.webp'] }
                  publicUrl: { type: string, format: uri, description: R2_PUBLIC_BASE_URL + "/" + key }
                  expiresIn: { type: integer, const: 300, description: Seconds }
        '401': { $ref: '#/components/responses/Error' }
        '422':
          description: UPLOAD_NOT_ALLOWED (type not jpeg/png/webp, or size over 2 MB) or VALIDATION_ERROR
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` (5 presigns per user per 15 minutes)" }
  /me/addresses:
    get:
      tags: [Me]
      summary: List addresses (PROF-02)
      description: Own addresses only, the default first, then newest first.
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Address' } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Me]
      summary: Add address (PROF-02)
      description: >-
        At most 10 addresses per user (409 `ADDRESS_LIMIT_REACHED`). The first address becomes the default
        automatically. `isDefault: true` unsets every other default of the user in the same transaction.
        Unknown fields are rejected (422).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } }
        '401': { $ref: '#/components/responses/Error' }
        '409':
          description: ADDRESS_LIMIT_REACHED — the user already has 10 addresses
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: OUT_OF_DELIVERY_AREA — cityCode is unknown or inactive (ADR-008); VALIDATION_ERROR for an invalid Saudi phone, bad length or unknown field
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /me/addresses/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Me]
      summary: Update address
      description: >-
        Partial update (any subset of the AddressInput fields, at least one). The city is re-checked only when
        `cityCode` is in the body. `isDefault: true` unsets every other default in the same transaction;
        `isDefault: false` on the current default is 422 VALIDATION_ERROR (set another address as default instead).
        Another user's address, a missing one and a malformed id all answer 404 NOT_FOUND.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddressPatch' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: NOT_FOUND — missing, malformed id, or owned by another user
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: "OUT_OF_DELIVERY_AREA — cityCode is unknown or inactive (ADR-008); VALIDATION_ERROR for an invalid Saudi phone, unknown field or `isDefault: false` on the default"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      tags: [Me]
      summary: Delete address
      description: >-
        Hard delete (orders keep their own address snapshot). Deleting the default promotes the most recently
        updated remaining address; deleting the last address is allowed.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: NOT_FOUND — missing, malformed id, or owned by another user
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ---------------- CATALOG ----------------
  /categories:
    get:
      tags: [Catalog]
      security: []
      summary: Active categories tree (CAT-01)
      description: >-
        Roots with their active children nested one level in `children`, both sorted by `sortOrder` then `slug`.
        Inactive categories are omitted; an inactive parent hides its whole subtree (children are not re-rooted).
        `productCount` is not included here (admin list only).
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } }
  /products:
    get:
      tags: [Catalog]
      security: []
      summary: Published products with filters (PROD-01)
      description: >-
        Only PUBLISHED products. `q` (max 100 chars, 422 above) searches `searchText`: the query is lowercased,
        Arabic-normalised (diacritics/tatweel removed, أ/إ/آ→ا, ة→ه, ى→ي, Arabic-Indic digits→ASCII), regex
        characters are escaped, and matched with case-insensitive `contains`. `category` is a category slug and
        includes products of its direct sub-categories; an unknown slug returns an empty page (not 404).
        `material` matches case-insensitively (exact). `inStock=true` means stock > 0. Category `isActive`
        does not hide products (it affects navigation only, T-009). Sort `featured` = isFeatured desc, then
        newest; default `newest`. Prices are halalas, min/max inclusive (owner decisions 2026-11-22, T-010).
      parameters:
        - { name: q, in: query, description: "Words (all must match). A word also matches its plural or singular (sofas / sofa). Searched in the title, the description, the category name and the material, in English and Arabic. Case-insensitive; regex characters are literal.", schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, description: category slug (includes its sub-categories' products), schema: { type: string } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ProductType' } }
        - { name: condition, in: query, schema: { type: array, items: { $ref: '#/components/schemas/Condition' } }, style: form, explode: false }
        - { name: minPrice, in: query, schema: { type: integer } }
        - { name: maxPrice, in: query, schema: { type: integer } }
        - { name: material, in: query, schema: { type: string } }
        - { name: inStock, in: query, schema: { type: boolean } }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc, featured], default: newest } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } }
  /products/{slug}:
    get:
      tags: [Catalog]
      security: []
      summary: Product detail + related (PROD-02)
      description: >-
        Only a PUBLISHED product resolves; DRAFT, ARCHIVED and unknown slugs -> 404. `related` holds up to 8
        PUBLISHED products of the same category, excluding the product itself, newest first (owner 2026-11-22).
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: '#/components/schemas/Product' }
                  related: { type: array, items: { $ref: '#/components/schemas/Product' } }
        '404': { $ref: '#/components/responses/Error' }

  # ---------------- CMS (public) ----------------
  /cms/home:
    get:
      tags: [CMS]
      security: []
      summary: Active banners + visible sections with resolved products (ADM-06, ADM-07)
      description: >-
        Banners: `isActive` and inside the schedule (`startsAt` unset or <= now, `endsAt` unset or > now),
        ordered by `sortOrder`. Sections: `isVisible` only, ordered by `sortOrder`. Resolution (owner
        2026-11-22): FEATURED_PRODUCTS = `config.productIds` (PUBLISHED only, given order) when set, else
        featured PUBLISHED newest-first; NEW_ARRIVALS = PUBLISHED newest-first; RESALE_PICKS = PUBLISHED RESALE
        newest-first (all with `config.limit`, default 8, max 24); CATEGORY_GRID = `config.categoryIds` (active
        only, given order) when set, else all active root categories; PROMO_BANNER = `config.bannerId` resolved
        into `banner` when that banner is active and inside its schedule, otherwise the property is omitted
        (storefront skips the section); TESTIMONIALS = `config.testimonials` passed through; SHOP_THE_LOOK (ADM-15) = `config.look` resolved into `look`: each hotspot gets its PUBLISHED product (a hotspot whose product is unpublished or deleted is dropped), and the property is omitted when the photo is missing or no hotspot is left (storefront skips the section).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  banners: { type: array, items: { $ref: '#/components/schemas/Banner' } }
                  sections:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/HomeSection'
                        - type: object
                          properties:
                            products: { type: array, items: { $ref: '#/components/schemas/Product' } }
                            categories:
                              type: array
                              description: >-
                                CATEGORY_GRID items carry `productCount` (CR-011 T-092): PUBLISHED products in the category and its direct sub-categories, the same set the shop filter shows.
                              items:
                                allOf:
                                  - $ref: '#/components/schemas/Category'
                                  - type: object
                                    required: [productCount]
                                    properties: { productCount: { type: integer, minimum: 0 } }
                            banner: { $ref: '#/components/schemas/Banner' }
                            look: { $ref: '#/components/schemas/ResolvedLook' }
  /cms/settings:
    get:
      tags: [CMS]
      security: []
      summary: Public site settings (ADM-09). `deliveryCities` contains active cities only (ADM-13)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SiteSetting' } } }
  /cms/pages/{slug}:
    get:
      tags: [CMS]
      security: []
      summary: Published static page (ADM-08)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } }
        '404': { $ref: '#/components/responses/Error' }

  # ---------------- CART ----------------
  # Customers only (requireRole CUSTOMER): an admin gets 403. Writes are optimistic-concurrent on
  # Cart.version (conditional update, re-read and re-apply up to 3 attempts, then 409 CART_CONFLICT).
  /cart:
    get:
      tags: [Cart]
      summary: Current cart with live prices, delivery fee and VAT (CART-01, ADR-009)
      description: |
        Read-only: the stored cart is never rewritten by this request. Each line is checked against the live
        product and flagged with `issue` (priority UNAVAILABLE > OUT_OF_STOCK > QTY_REDUCED > PRICE_CHANGED;
        PRICE_CHANGED carries `details: {oldPrice, newPrice}` compared against the `priceSeen` stored on the
        line). `qty` in the response is the effective (stock-capped) quantity. Only effective lines
        (not UNAVAILABLE/OUT_OF_STOCK) are passed to the pricing function; an empty or fully ineffective cart
        prices as 0 (deliveryFee 0, vatAmount 0, total 0) even when a base fee is set.
        `addressId` must belong to the caller (404 otherwise); an address whose city is unknown or
        deactivated still prices with the base fee but returns `address.isDeliverable: false`
        (checkout, not the cart, rejects with OUT_OF_DELIVERY_AREA — ORD-01).
      parameters:
        - name: addressId
          in: query
          required: false
          description: When given, the delivery fee uses that address's city (override or default) and the response includes `address`; otherwise the base fee.
          schema: { $ref: '#/components/schemas/ObjectId' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error', description: Not a customer }
        '404': { $ref: '#/components/responses/Error', description: addressId unknown or not owned by the caller }
  /cart/items:
    put:
      tags: [Cart]
      summary: Set quantity for a product (0 removes)
      description: |
        Upserts one line and refreshes its `priceSeen` to the live price. `qty` above live stock -> 409
        `OUT_OF_STOCK` with `details: {productId, stock}`, nothing written. Unknown or non-PUBLISHED
        product -> 404. Adding a 51st distinct line -> 409 `CART_LIMIT_REACHED`. Concurrent writes that
        keep conflicting after 3 attempts -> 409 `CART_CONFLICT` (client retries).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, qty]
              additionalProperties: false
              properties:
                productId: { $ref: '#/components/schemas/ObjectId' }
                qty: { type: integer, minimum: 0, maximum: 100000 }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error', description: Not a customer }
        '404': { $ref: '#/components/responses/Error', description: Product unknown or not PUBLISHED }
        '409': { $ref: '#/components/responses/Error', description: "`OUT_OF_STOCK` (details: {productId, stock}), `CART_LIMIT_REACHED` (max 50 distinct lines) or `CART_CONFLICT` (concurrent writes, retry)" }
  /cart/merge:
    post:
      tags: [Cart]
      summary: Merge guest cart after login (CART-01)
      description: |
        Idempotent (owner 2026-11-22): for each product the new qty = max(existing qty, guest qty), capped at
        live stock — repeating the same merge never doubles quantities. Duplicate productIds in the payload are
        combined with max. Unknown and non-PUBLISHED products are skipped silently (best effort, no 409).
        Each merged line's `priceSeen` is refreshed to the live price. Lines beyond the 50-line cart limit are
        dropped (existing lines first). The web client clears the localStorage cart only after a successful
        response (web T-036).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              additionalProperties: false
              properties:
                items:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [productId, qty]
                    additionalProperties: false
                    properties:
                      productId: { $ref: '#/components/schemas/ObjectId' }
                      qty: { type: integer, minimum: 1, maximum: 100000 }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error', description: Not a customer }
        '409': { $ref: '#/components/responses/Error', description: "`CART_CONFLICT` (concurrent writes, retry)" }

  # ---------------- WISHLIST (FAV-01, CR-007) ----------------
  # Customers only (requireRole CUSTOMER): an admin gets 403. Bearer auth only (no CSRF header), like /cart. Register the static /me/wishlist/merge route before /me/wishlist/{productId}.
  # Per-item writes (owner 2026-11-24): add and remove are idempotent, so two tabs or devices never overwrite
  # each other's list. Writes are optimistic-concurrent on Wishlist.version (conditional update, re-read and
  # re-apply up to 3 attempts, then 409 WISHLIST_CONFLICT). Rate limit: same as /cart writes.
  /me/wishlist:
    get:
      tags: [Wishlist]
      summary: My favourites (FAV-01)
      description: |
        Returns the stored ids and the PUBLISHED products among them, newest first. Ids of products that were
        unpublished or deleted are not returned and not counted (`total` counts what `items` holds).
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Wishlist' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error', description: Not a customer }
    delete:
      tags: [Wishlist]
      summary: Clear all my favourites (FAV-01)
      description: Idempotent. Removes every stored id.
      responses:
        '204': { description: Cleared }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error', description: Not a customer }
  /me/wishlist/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ObjectId' }
    put:
      tags: [Wishlist]
      summary: Add one product to my favourites (FAV-01)
      description: |
        Idempotent add: adding a product that is already saved returns 200 with the unchanged list. Unknown or
        non-PUBLISHED product -> 404 `NOT_FOUND`. A 101st distinct product -> 409
        `WISHLIST_LIMIT_REACHED` (max 100). Concurrent writes that keep conflicting after 3 attempts -> 409
        `WISHLIST_CONFLICT` (client retries). No request body.
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Wishlist' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error', description: Not a customer }
        '404': { $ref: '#/components/responses/Error', description: "`NOT_FOUND` (unknown or not PUBLISHED)" }
        '409': { $ref: '#/components/responses/Error', description: "`WISHLIST_LIMIT_REACHED` (max 100) or `WISHLIST_CONFLICT` (concurrent writes, retry)" }
    delete:
      tags: [Wishlist]
      summary: Remove one product from my favourites (FAV-01)
      description: Idempotent remove (also for ids of deleted products and for ids that are not saved) -> 200 with the list.
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Wishlist' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error', description: Not a customer }
        '409': { $ref: '#/components/responses/Error', description: "`WISHLIST_CONFLICT` (concurrent writes, retry)" }
  /me/wishlist/merge:
    post:
      tags: [Wishlist]
      summary: Merge guest favourites after login (FAV-01)
      description: |
        Idempotent union: existing account ids first (order kept), then the given ids in the given order.
        Duplicates, malformed ids, unknown and non-PUBLISHED products are skipped (counted in `skipped`); the
        result is truncated at 100 (counted in `truncated`). Repeating the same merge changes nothing. The web
        client clears the localStorage list only after a successful response (web T-048).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productIds]
              additionalProperties: false
              properties:
                productIds:
                  type: array
                  maxItems: 100
                  items: { type: string, maxLength: 64, description: 'ObjectId; malformed values are skipped, not rejected' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  productIds: { type: array, items: { $ref: '#/components/schemas/ObjectId' } }
                  total: { type: integer }
                  skipped: { type: integer, description: Given ids dropped (duplicate, malformed, unknown, unpublished) }
                  truncated: { type: integer, description: Valid ids dropped by the 100 cap }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error', description: Not a customer }
        '409': { $ref: '#/components/responses/Error', description: "`WISHLIST_CONFLICT` (concurrent writes, retry)" }
        '422': { $ref: '#/components/responses/Error', description: "VALIDATION_ERROR (body is not {productIds: string[] with at most 100 entries})" }

  # ---------------- ORDERS ----------------
  /orders:
    post:
      tags: [Orders]
      summary: Place COD order from cart (ORD-01)
      description: >-
        Re-validates stock and price, decrements stock atomically (per item `updateMany` whose where-clause
        includes `stock: {gte: qty}`, `status: PUBLISHED` AND `price: <the unitPrice used for pricing>`; a
        count of 0 aborts the transaction and the whole placement is retried from a fresh read, so a price
        change between read and transaction yields 409 `PRICE_CHANGED`, never an order at the old price),
        creates the order (PENDING, COD, UNPAID, full snapshot including `deliveryFee` and `vat` even when 0),
        clears the cart (version-conditional: a concurrent cart write is never silently lost) and emits
        `order.created` after commit. Totals come from `computePricing` fed with the order lines (ADR-009).
        Idempotent (owner 2026-11-22): the required `Idempotency-Key` header (a UUID, generated once per
        checkout attempt and reused on retries — web T-038) is stored on the order with a unique
        (userId, idempotencyKey) index; a retry after success returns the existing order as 200 with the
        identical body, without re-validating or decrementing; a concurrent duplicate that loses the unique
        index re-reads and returns the winner's order. COD abuse limits (owner 2026-11-22, PRD ORD-01): at
        most 3 orders per user per hour and at most 3 PENDING orders per user at once.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
          description: UUID generated once per checkout attempt and reused on retry; missing or malformed -> 422 `VALIDATION_ERROR`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [addressId, expectedTotal]
              properties:
                addressId: { $ref: '#/components/schemas/ObjectId' }
                customerNote: { type: string, maxLength: 500, description: Plain text, trimmed; consumers always render it escaped (admin T-065, order emails T-014) }
                expectedTotal: { type: integer, minimum: 0, description: Required. Total (halalas) the customer saw; if it differs from the server-computed total the order is rejected with 409 PRICE_CHANGED (ADR-009) }
      responses:
        '201':
          description: "Created. `statusHistory` starts with `{status: PENDING, at, byUserId: <the customer>}`."
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '200':
          description: Idempotent replay — this user already created an order with this `Idempotency-Key`; the body is identical to the original 201.
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '404': { $ref: '#/components/responses/Error', description: Unknown, foreign or malformed `addressId` (T-007 rule) }
        '409':
          description: >-
            `OUT_OF_STOCK` — `details.items: [{productId, stock}]`, one entry per failing line with the live
            stock (0 when the product is gone or unpublished), nothing decremented, the cart kept /
            `PRICE_CHANGED` — `details: {expectedTotal, total, items: [{productId, oldPrice, newPrice}]}`
            where `items` compares the live price against the cart's stored `priceSeen` (display only; the
            gate is the total), nothing decremented, no order created / `CART_EMPTY` — no lines /
            `TOO_MANY_PENDING_ORDERS` — the user already has 3 PENDING orders / `CONFLICT` — persistent
            concurrent stock updates after retries (client may retry).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: "`OUT_OF_DELIVERY_AREA` — address city unknown or inactive (ADR-008) / `IDEMPOTENCY_MISMATCH` — same `Idempotency-Key` with a different `addressId` or `expectedTotal` / `VALIDATION_ERROR` — missing or malformed `Idempotency-Key`, `expectedTotal` or body"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` — more than 3 orders per user per hour (T-024 store), with `Retry-After`" }
    get:
      tags: [Orders]
      summary: My orders (ORD-02)
      description: The authenticated customer's own orders, newest first.
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } }
  /orders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Orders]
      summary: My order detail (ORD-02)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '404': { $ref: '#/components/responses/Error' }
  /orders/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Orders]
      summary: Cancel own PENDING order (ORD-03)
      description: >
        Owner only — an order belonging to another user (or an unknown/malformed id) returns 404,
        never 403, so ownership is not revealed. Only a PENDING order can be cancelled by the
        customer (checked on the fresh status inside the transaction's retry loop, so a concurrent
        admin CONFIRM wins with 409). The body is optional and may carry a plain-text `reason`
        (trimmed, max 300; absent or empty means no reason). The cancel restores stock in the same
        transaction, appends a StatusEvent (byUserId = the customer, note = the trimmed reason or
        null — visible in the admin order detail only, never in customer responses or emails),
        leaves paymentStatus UNPAID and emits `order.statusChanged` after commit (ORD-04 email,
        NOTIF).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 300
                  description: Optional plain-text cancel reason; stored as the admin-only StatusEvent note.
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: INVALID_TRANSITION — order is not PENDING
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/Error', description: 'VALIDATION_ERROR — reason over 300 characters or an unknown field' }

  # ---------------- INTERNAL (Vercel Cron, ADR-012) ----------------
  /internal/cron/cleanup:
    servers: [{ url: 'http://localhost:1000' }]   # not under /api/v1
    get:
      tags: [Internal]
      summary: Cleanup job called by Vercel Cron (daily). Also accepts POST for manual runs.
      description: >
        Deletes expired or consumed OTPs; expired or revoked refresh tokens; Socket.IO adapter documents older than
        SOCKET_ADAPTER_TTL_SECONDS; read notifications (readAt set) older than 90 days and unread ones (readAt null or
        missing) older than 180 days; and Upload rows never attached after 24 h (max 200 per run — the R2 object is
        deleted first, a failed R2 delete keeps the row for the next run; an R2 object referenced by an order item's
        imageKey is never deleted). Authenticated by `Authorization: Bearer CRON_SECRET` (what Vercel Cron sends) or header
        `x-cron-secret: CRON_SECRET`; not available to bearer JWTs. Idempotent. Not mounted when CRON_SECRET is unset.
      security: [{ cronBearer: [] }, { cronHeader: [] }]
      responses:
        '200':
          description: Counts of removed documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronCleanupResult'
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Internal]
      summary: Same as GET (manual run)
      security: [{ cronBearer: [] }, { cronHeader: [] }]
      responses:
        '200':
          description: Counts of removed documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronCleanupResult'
        '401': { $ref: '#/components/responses/Error' }

  # ---------------- NOTIFICATIONS ----------------
  /notifications:
    get:
      tags: [Notifications]
      summary: My notifications, newest first (NOTIF-03; any authenticated user — admins see their NEW_ORDER rows, ADM-10)
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/NotificationLimit' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
                  unread: { type: integer, description: Caller's unread count (readAt null or missing); clients re-fetch this endpoint after every socket connect (integrations.md) }
        '401': { $ref: '#/components/responses/Error' }
  /notifications/{id}/read:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Notifications]
      summary: Mark one as read (idempotent — an already-read own id answers 204 again without touching readAt)
      responses:
        '204': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error', description: 'NOT_FOUND: unknown, malformed or another user''s notification id (ownership is never revealed, T-016)' }
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all my notifications as read
      responses:
        '204': { description: OK }
        '401': { $ref: '#/components/responses/Error' }

  # ---------------- ADMIN ----------------
  /admin/dashboard/summary:
    get:
      tags: [Admin]
      summary: KPIs, 30-day order series, latest orders, low stock (ADM-01)
      description: |
        All day and month boundaries are **Asia/Riyadh calendar days** (fixed UTC+3, no DST — the T-014
        convention). `todayOrders` counts every order placed today, any status. `pendingOrders` counts all
        orders currently PENDING. `monthRevenue` is the sum of `Order.total` (integer halalas, summed in the
        database — no float math on money, NFR on ADR-009) over orders whose **DELIVERED status event** falls
        in the current Riyadh month, so an order created last month but delivered this month counts, and one
        delivered last month does not. `lowStockCount` counts PUBLISHED products with `stock <= 2` (DRAFT and
        ARCHIVED excluded). `ordersByDay` is the last 30 Riyadh days including today, oldest first,
        zero-filled, `date` = the Riyadh `YYYY-MM-DD`. `latestOrders` = the 5 newest orders in the admin
        `Order` shape (T-018).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  todayOrders: { type: integer }
                  pendingOrders: { type: integer }
                  monthRevenue: { type: integer, description: Halalas; sum of DELIVERED totals this Riyadh month }
                  lowStockCount: { type: integer }
                  ordersByDay: { type: array, minItems: 30, maxItems: 30, items: { type: object, properties: { date: { type: string, format: date }, count: { type: integer } } } }
                  latestOrders: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/Order' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/uploads/presign:
    post:
      tags: [Admin]
      summary: Get a presigned PUT URL to upload an image straight to Cloudflare R2 (ADR-010)
      description: |
        Admin only. The browser then PUTs the file to `uploadUrl` with the same `Content-Type` and the signed size.
        Save the returned `key` (not the URL) on the product/banner. Allowed: image/jpeg, image/png, image/webp, max 5 MB.
        Key format: `furnixa/{env}/{yyyy}/{mm}/{uuid}.{ext}`. Required bucket CORS rule: see integrations.md.
        Each call records an `Upload` row (data-model.md); saves that add the key must attach it (the object must exist with the approved type and size, otherwise 422 `UPLOAD_NOT_ALLOWED` on the saving route). SVG is never allowed.
        Limit: 30 presigns per admin per 10 minutes (429 `RATE_LIMITED`, `Retry-After`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType, size]
              properties:
                fileName: { type: string, maxLength: 255, description: Informational only; never used in the key }
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                size: { type: integer, minimum: 1, maximum: 5242880, description: Bytes }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [uploadUrl, key, publicUrl, expiresIn]
                properties:
                  uploadUrl: { type: string, format: uri }
                  key: { type: string, examples: ['furnixa/production/2026/11/3f2b8c1e-0c4d-4a52-9d7e-1b2a3c4d5e6f.webp'] }
                  publicUrl: { type: string, format: uri, description: R2_PUBLIC_BASE_URL + "/" + key }
                  expiresIn: { type: integer, const: 300, description: Seconds }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` (30 presigns per admin per 10 minutes)" }
        '422':
          description: UPLOAD_NOT_ALLOWED (type not jpeg/png/webp, or size over 5 MB) or VALIDATION_ERROR
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /admin/products:
    get:
      tags: [Admin]
      summary: All products incl. drafts (ADM-02)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProductStatus' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ProductType' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } }
    post:
      tags: [Admin]
      summary: Create product
      description: >-
        Images carry only `key` (+ optional `alt`); the server recomputes `url` and attaches the uploads
        (`syncImages`, scope admin). Rules (owner 2026-11-22, T-010): type NEW requires condition NEW; type
        RESALE requires LIKE_NEW/GOOD/FAIR; `compareAtPrice` > `price` when set; DRAFT needs at least one
        non-empty locale, PUBLISHED both locales, for title and description (I18N-02) -> 422 otherwise.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } }
        '409': { $ref: '#/components/responses/Error', description: "`SLUG_TAKEN`" }
        '422': { $ref: '#/components/responses/Error', description: "`VALIDATION_ERROR` (incl. unknown categoryId, type/condition mismatch, publish gate) or `UPLOAD_NOT_ALLOWED`" }
  /admin/products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin]
      summary: Product by id
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Admin]
      summary: Update product (optimistic concurrency)
      description: >-
        Partial update; `expectedUpdatedAt` (the `updatedAt` the admin loaded) is required. The update is one
        conditional write (`where id AND updatedAt = expectedUpdatedAt`); when nothing matches the response is
        409 `STALE_UPDATE` with the current product in `details.current` and nothing is changed (owner
        2026-11-22, T-010). The create rules (type/condition, compareAtPrice, publish gate) apply to the merged
        result. Admin UI (T-064): on 409 STALE_UPDATE show "This product was changed, reload" and keep the edits.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductPatch' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error', description: "`SLUG_TAKEN` or `STALE_UPDATE` (current product in `details.current`)" }
        '422': { $ref: '#/components/responses/Error', description: "`VALIDATION_ERROR` or `UPLOAD_NOT_ALLOWED`" }
    delete:
      tags: [Admin]
      summary: Delete, or archive if referenced by orders
      description: >-
        Hard delete releases every image (R2 object + Upload row; a failed DeleteObject is logged, the request
        still succeeds). A product that appears in any order's items is archived instead (status ARCHIVED,
        images kept). An R2 object referenced by an order item's `imageKey` is never deleted (detach only).
      responses:
        '204': { description: Deleted or archived }
        '404': { $ref: '#/components/responses/Error' }
  /admin/categories:
    get:
      tags: [Admin]
      summary: All categories (ADM-03)
      description: Flat list (no `children`), including inactive, sorted by `sortOrder` then `slug`, each with `productCount` (products in any status, incl. ARCHIVED).
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Admin]
      summary: Create category (ADM-03)
      description: >-
        `image` takes an R2 `key` from `POST /admin/uploads/presign`; the server recomputes `url` and attaches the
        upload (scope `admin`): a key outside `furnixa/{env}/`, a missing object, or a type/size mismatch -> 422
        `UPLOAD_NOT_ALLOWED`. `parentId` must reference a root category (one level of sub-categories, CAT-01); a
        deeper parent or self-reference -> 422 `VALIDATION_ERROR`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error', description: "`SLUG_TAKEN` — another category already uses this slug" }
        '422':
          description: VALIDATION_ERROR (bad slug/name/parent, unknown field) or UPLOAD_NOT_ALLOWED (bad image key)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /admin/categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      summary: Update category (ADM-03)
      description: >-
        Partial update. Same image and parent rules as create; additionally, a category that has children cannot be
        given a parent (one level, 422). Replacing or removing (`image: null`) the image deletes the old R2 object
        after commit. Changing `slug` is allowed; uniqueness is enforced (409 `SLUG_TAKEN`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CategoryPatch' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: NOT_FOUND — missing or malformed id
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409': { $ref: '#/components/responses/Error', description: "`SLUG_TAKEN`" }
        '422':
          description: VALIDATION_ERROR (empty body, bad value, unknown field, depth rule) or UPLOAD_NOT_ALLOWED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      tags: [Admin]
      summary: Delete category (ADM-03)
      description: >-
        Hard delete; releases the category's image from R2 after commit (a failed R2 delete is logged, the request
        still succeeds). Refused while the category has products (any status, incl. ARCHIVED) or child categories.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: NOT_FOUND — missing or malformed id
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409': { $ref: '#/components/responses/Error', description: "`CATEGORY_HAS_PRODUCTS` or `CATEGORY_HAS_CHILDREN`" }
  /admin/orders:
    get:
      tags: [Admin]
      summary: All orders (ADM-04)
      description: >-
        Sorted newest first. `q` (trimmed, max 100 chars, 422 above; regex metacharacters are
        literal — rule 9) matches the `orderNo` or the customer email (case-insensitive contains);
        when `q` normalises to a Saudi mobile number (`SaudiPhoneInput` rules, e.g. "055 123 4567"
        or Arabic-Indic digits) it also matches the order's snapshot `address.phone` exactly
        (owner 2026-11-22, T-014). `from`/`to` are inclusive calendar days in **Asia/Riyadh** (the
        `orderNo` convention); `from` > `to` simply yields an empty page.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: q, in: query, description: orderNo / customer email / Saudi phone, schema: { type: string, maxLength: 100 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422':
          description: VALIDATION_ERROR — `q` over 100 chars or a malformed query value
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /admin/orders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin]
      summary: Order detail
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: NOT_FOUND — missing or malformed id
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /admin/orders/{id}/status:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      summary: Transition status; 409 on invalid transition (ADM-04, ORD-04, NOTIF-01)
      description: >-
        Transition matrix (owner 2026-11-22, T-014): PENDING → CONFIRMED | CANCELLED;
        CONFIRMED → PROCESSING | CANCELLED; PROCESSING → OUT_FOR_DELIVERY | CANCELLED;
        OUT_FOR_DELIVERY → DELIVERED | CANCELLED (COD — customer refused or unreachable);
        DELIVERED and CANCELLED are terminal. The transition is one conditional write inside a
        transaction: DELIVERED also sets `paymentStatus` PAID; CANCELLED restores stock and leaves
        `paymentStatus` UNPAID; every transition appends a `StatusEvent` {status, at, byUserId: the
        admin, note}. After commit the customer gets the `order-status` email in their
        `preferredLocale` (ORD-04); the internal note is never included in the email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
                note: { type: string, minLength: 3, maxLength: 500, description: 'Internal (trimmed, never shown to the customer). REQUIRED — the cancel reason, 3–500 chars — when status is CANCELLED (422 VALIDATION_ERROR when missing or too short); optional otherwise.' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: NOT_FOUND — missing or malformed id
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: 'INVALID_TRANSITION — `details: {from, to, allowed}`, computed against the current status (also when a concurrent transition won)'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: VALIDATION_ERROR — missing/short cancel reason or malformed body
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /admin/orders/{id}/note:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      summary: Set internal admin note (ADM-04)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminNote]
              properties:
                adminNote: { type: ['string', 'null'], maxLength: 2000, description: 'Trimmed; `null` clears it. Internal — never in customer responses or emails (owner 2026-11-22, T-014).' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: NOT_FOUND — missing or malformed id
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: VALIDATION_ERROR — adminNote missing, not string/null or over 2000 chars
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /admin/customers:
    get:
      tags: [Admin]
      summary: Customers with order count (ADM-05)
      description: >-
        Users with role CUSTOMER only (verified and unverified), newest first. `q` (trimmed, <= 100 chars)
        matches the email, first name or last name case-insensitively (escaped literal, rule 9), or — when it
        normalises to a Saudi mobile number (NFR-06, incl. Arabic-Indic digits) — the exact stored phone.
        CR-011 (ADM-17): `status` filters by state: `active` (not blocked, not deleted), `blocked` (blocked, not deleted) or `deleted` (soft-deleted, anonymised); without it the list shows active and blocked customers and never deleted ones.
      parameters: [{ name: q, in: query, schema: { type: string, maxLength: 100 } }, { name: status, in: query, schema: { type: string, enum: [active, blocked, deleted] } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CustomerListItem' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error', description: "`VALIDATION_ERROR` — `q` over 100 chars, bad page/limit, unknown `status`" }
  /admin/customers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin]
      summary: Customer detail with their orders (newest first, paginated)
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/AdminCustomer' }
                  orders: { type: array, items: { $ref: '#/components/schemas/Order' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: NOT_FOUND — unknown or malformed id, or the user is not a CUSTOMER (admins are served by /admin/admins)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    patch:
      tags: [Admin]
      summary: Edit a customer's name and phone (ADM-17)
      description: >-
        CR-011. Admin only; customers only. The body accepts `firstName`, `lastName` and `phone` (a Saudi mobile,
        stored as +9665XXXXXXXX; `null` clears it) and nothing else: any other field (email, password, role, ...) is
        422. At least one of the three is required. `expectedUpdatedAt` is required; a mismatch -> 409
        `STALE_UPDATE`. No response contains a password hash and the admin can never set or read one. Targeting
        oneself -> 403 `FORBIDDEN_TARGET`; another admin -> 404; a soft-deleted customer -> 409 `CUSTOMER_DELETED`.
        Email change is out of scope. One log line per call (`customer.update`: actor id, target id, changed field
        names; no personal data).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPatch' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminCustomer' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error', description: "FORBIDDEN (not an admin) or `FORBIDDEN_TARGET` (the target is the caller)" }
        '404': { $ref: '#/components/responses/Error', description: NOT_FOUND — unknown or malformed id, or the user is not a CUSTOMER }
        '409': { $ref: '#/components/responses/Error', description: "`STALE_UPDATE` or `CUSTOMER_DELETED`" }
        '422': { $ref: '#/components/responses/Error', description: "`VALIDATION_ERROR` — unknown field, empty body, bad name, or a phone that is not a Saudi mobile" }
    delete:
      tags: [Admin]
      summary: Delete a customer (soft delete with anonymisation, ADM-17)
      description: >-
        CR-011. Admin only; customers only. Body `{ confirmEmail }` must equal the stored email (case-insensitive),
        else 422 `CONFIRM_EMAIL_MISMATCH`. Refused with 409 `CUSTOMER_HAS_OPEN_ORDERS` while the customer has a
        PENDING or CONFIRMED order. In one transaction: name becomes "Deleted customer", email becomes a unique
        non-deliverable placeholder (the real address is free to register again), phone and avatar are cleared,
        the password becomes an unusable hash, `isBlocked` is true, `deletedAt`/`deletedById` are set, all
        refresh tokens are revoked, and addresses, cart, wishlist, notifications and pending OTPs are removed.
        **Orders are kept** with their address snapshot (the sales and VAT record). Live sockets are disconnected
        and the avatar object is released after commit. Targeting oneself -> 403 `FORBIDDEN_TARGET`; another admin
        -> 404; already deleted -> 409 `CUSTOMER_DELETED`. One log line (`customer.delete`, no personal data).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerDeleteInput' } } }
      responses:
        '200':
          description: OK (the anonymised customer)
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminCustomer' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error', description: "FORBIDDEN or `FORBIDDEN_TARGET`" }
        '404': { $ref: '#/components/responses/Error', description: NOT_FOUND }
        '409': { $ref: '#/components/responses/Error', description: "`CUSTOMER_HAS_OPEN_ORDERS` or `CUSTOMER_DELETED`" }
        '422': { $ref: '#/components/responses/Error', description: "`CONFIRM_EMAIL_MISMATCH` or `VALIDATION_ERROR`" }
  /admin/customers/{id}/block:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      summary: Block / unblock a customer
      description: >-
        Customers only — an ADMIN id -> 404 (admins are blocked via /admin/admins/{id}/block); the caller's own id -> 403 `FORBIDDEN_TARGET`; a soft-deleted customer -> 409 `CUSTOMER_DELETED`. Idempotent.
        CR-011 (ADM-17): blocking requires a `reason` (3 to 300 characters, admin-only: it is stored with `blockedAt` and `blockedById`, shown only in the admin API and never to the customer). Unblocking may send a `reason`, which is not stored; it clears the three blocked fields to explicit null. The customer sees only the generic `ACCOUNT_BLOCKED` response on login, refresh and any authenticated call, and cannot request a password reset code or place an order. One log line per call (`customer.block` / `customer.unblock`: actor id, target id, field names; no personal data, no reason text).
        Blocking revokes every refresh token in the same transaction and then disconnects the user's live
        sockets (`socketEmitter.disconnectUser`, T-023); the still-valid access token is rejected by
        `requireAuth` (T-005). Unblocking only clears the flag (the login lockout counter is untouched).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerBlockInput' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminCustomer' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error', description: "FORBIDDEN or `FORBIDDEN_TARGET`" }
        '404':
          description: NOT_FOUND — unknown or malformed id, or the user is not a CUSTOMER
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409': { $ref: '#/components/responses/Error', description: "`CUSTOMER_DELETED`" }
        '422': { $ref: '#/components/responses/Error', description: "`VALIDATION_ERROR` — isBlocked missing or not boolean, or blocking without a reason of 3 to 300 characters" }
  /admin/banners:
    get:
      tags: [Admin]
      summary: All banners (ADM-06)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Banner' } } } }
    post:
      tags: [Admin]
      summary: Create banner
      description: Revalidates the storefront tag `home` (T-011). Images use `syncImages` (scope `admin`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BannerInput' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Banner' } } }
        '422': { $ref: '#/components/responses/Error', description: "`VALIDATION_ERROR` (missing alt, bad ctaHref, startsAt >= endsAt) or `UPLOAD_NOT_ALLOWED`" }
  /admin/banners/order:
    put:
      tags: [Admin]
      summary: Set banner order by id list (CR-011, ADM-06)
      description: >-
        `ids` must be exactly the set of existing banner ids, each once, else 422 `VALIDATION_ERROR` and nothing is
        written (all-or-nothing). `sortOrder` becomes the list position (1 to n); it drives the hero slide order.
        Revalidates `home`. Used by the admin's drag to reorder.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [ids], properties: { ids: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/ObjectId' } } } }
      responses:
        '204': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error', description: "`VALIDATION_ERROR` — ids missing, duplicated, unknown, or not the full set" }
  /admin/banners/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      summary: Update banner (optimistic concurrency)
      description: >-
        Partial update; `expectedUpdatedAt` is required, mismatch -> 409 `STALE_UPDATE` with the current banner
        in `details.current` (owner 2026-11-22, T-011). Schedule and href rules apply to the merged result.
        Revalidates `home`; replaced or removed images are released after commit.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BannerPatch' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Banner' } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error', description: "`STALE_UPDATE` (current banner in `details.current`)" }
        '422': { $ref: '#/components/responses/Error', description: "`VALIDATION_ERROR` or `UPLOAD_NOT_ALLOWED`" }
    delete:
      tags: [Admin]
      summary: Delete banner
      description: Releases both images after commit (a failed DeleteObject is logged, the request succeeds). Revalidates `home`.
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /admin/home-sections:
    get:
      tags: [Admin]
      summary: All sections ordered (ADM-07)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HomeSection' } } } }
    post:
      tags: [Admin]
      summary: Create section
      description: Revalidates the storefront tag `home` (T-011).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HomeSectionInput' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/HomeSection' } } }
        '422': { $ref: '#/components/responses/Error' }
  /admin/home-sections/reorder:
    put:
      tags: [Admin]
      summary: Set order by id list
      description: >-
        `ids` must be exactly the set of existing section ids (each exactly once) -> 422 `VALIDATION_ERROR`
        otherwise; sortOrder becomes the list position. Revalidates `home` (T-011).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ids], properties: { ids: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ObjectId' } } } }
      responses:
        '204': { description: OK }
        '422': { $ref: '#/components/responses/Error' }
  /admin/home-sections/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      summary: Update section (optimistic concurrency)
      description: >-
        Partial update; `expectedUpdatedAt` is required, mismatch -> 409 `STALE_UPDATE` with the current section
        in `details.current` (owner 2026-11-22, T-011). Revalidates `home`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HomeSectionPatch' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/HomeSection' } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error', description: "`STALE_UPDATE` (current section in `details.current`)" }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Admin]
      summary: Delete section
      description: Revalidates `home` (T-011).
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /admin/pages:
    get:
      tags: [Admin]
      summary: All pages (ADM-08)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Page' } } } }
    post:
      tags: [Admin]
      summary: Create page
      description: >-
        `content` is sanitised server-side on every write (allowlist, ADR-013). A published page needs title and
        content in both locales; an unpublished one needs at least one non-empty locale (I18N-02). Revalidates
        `page:{slug}` (T-011).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PageInput' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } }
        '409': { $ref: '#/components/responses/Error', description: "`SLUG_TAKEN`" }
        '422': { $ref: '#/components/responses/Error' }
  /admin/pages/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      summary: Update page (optimistic concurrency)
      description: >-
        Partial update; `expectedUpdatedAt` is required, mismatch -> 409 `STALE_UPDATE` with the current page in
        `details.current` (owner 2026-11-22, T-011). Content is sanitised (ADR-013); the publish gate applies to
        the merged result. Revalidates `page:{slug}`, old and new slug on a rename.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PagePatch' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error', description: "`SLUG_TAKEN` or `STALE_UPDATE` (current page in `details.current`)" }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Admin]
      summary: Delete page
      description: Revalidates `page:{slug}` (T-011).
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /admin/settings:
    get:
      tags: [Admin]
      summary: Site settings (ADM-09)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SiteSetting' } } }
    put:
      tags: [Admin]
      summary: Replace site settings (incl. delivery cities, ADM-13)
      description: >-
        Optimistic concurrency (owner 2026-11-22, T-011): `expectedUpdatedAt` is required, mismatch -> 409
        `STALE_UPDATE` with the current settings in `details.current`. The logo uses `syncImages` (scope
        `admin`). Revalidates the storefront tags `settings`, `home` and `products` (VAT and delivery display
        can change on product pages). Delivery cities (ADM-13, T-022): the submitted `deliveryCities` must
        contain every existing city `code` — codes are immutable and cities can never be removed (deactivate
        instead); a missing code (removal or code change) -> 409 `CITY_CODE_IMMUTABLE` with the offending
        codes in `details.missingCodes`, nothing written. At least one submitted city must be active -> 422
        otherwise. Max 100 cities.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SiteSettingInput' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SiteSetting' } } }
        '409':
          description: "`STALE_UPDATE` (current settings in `details.current`), or `CITY_CODE_IMMUTABLE` — an existing city code was removed (deactivate it instead) or changed; the missing codes are in `details.missingCodes` (T-022)"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: VALIDATION_ERROR — no active delivery city or more than 100 cities (T-022), duplicate city code, missing ar/en city name, negative fee (base or per-city override), VAT rate outside 0–50% or more than 2 decimals, or invalid VAT registration number
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /admin/admins:
    get:
      tags: [Admin]
      summary: List admins (ADM-11)
      description: All ADMIN users (verified and pending invites), newest first, with `invitedById` for audit.
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminUser' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Admin]
      summary: Invite admin (ADM-11, T-017)
      description: |
        Creates a User with role ADMIN, `isVerified: false`, **no usable password** (a random hash; the invitee
        sets their own via `POST /auth/accept-invite`, so the inviter never knows it — owner decision 2026-11-22)
        and `invitedById` = the inviting admin. Issues an `INVITE_ADMIN` OTP valid `INVITE_TTL_SECONDS`
        (default 172800 = 48 h) and emails it (`admin-invite` template) in `preferredLocale` with a link to
        `ADMIN_URL + "/accept-invite?email=<urlencoded email>"` — the code is never in the URL.
        The T-004 issue limits apply per invited email (60 s cooldown, 5/hour) -> 429 `RATE_LIMITED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [firstName, lastName, email]
              properties:
                firstName: { type: string, minLength: 1, maxLength: 40 }
                lastName: { type: string, minLength: 1, maxLength: 40 }
                email: { type: string, format: email }
                preferredLocale: { $ref: '#/components/schemas/Locale', description: "Stored on the user and used for the invite and resend emails (not the inviter's Accept-Language). Default ar." }
      responses:
        '201':
          description: Created (pending acceptance)
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error', description: "`EMAIL_IN_USE` — any existing user with that email (any role, verified or not, incl. a pending customer registration)" }
        '422': { $ref: '#/components/responses/Error', description: "`VALIDATION_ERROR` — missing/overlong names, malformed email, unknown fields" }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` — OTP cooldown or hourly cap for that email" }
  /admin/admins/{id}/resend-invite:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admin]
      summary: Re-send a pending admin invite (ADM-11, T-017)
      description: >-
        Burns every live `INVITE_ADMIN` code of the invitee and issues a fresh one (full `INVITE_TTL_SECONDS`
        validity), emailed in the invitee's stored `preferredLocale`. Cooldown and hourly cap apply (429).
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: NOT_FOUND — unknown or malformed id, or the user is not an ADMIN
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409': { $ref: '#/components/responses/Error', description: "`ALREADY_VERIFIED` — the invite was already accepted" }
        '429': { $ref: '#/components/responses/RateLimited', description: "`RATE_LIMITED` — OTP cooldown or hourly cap for that email" }
  /admin/admins/{id}/block:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      summary: Block / unblock an admin (ADM-11, T-017)
      description: >-
        Admins only — a CUSTOMER id -> 404. Same effects as the customer block (refresh tokens revoked in the
        transaction, live sockets disconnected, access tokens rejected). Guards: blocking yourself -> 422
        `SELF_BLOCK`; blocking the last active verified admin -> 409 `LAST_ADMIN` (the store must always keep
        one admin who can log in; the check is serialized against concurrent admin blocks). Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [isBlocked], properties: { isBlocked: { type: boolean } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: NOT_FOUND — unknown or malformed id, or the user is not an ADMIN
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409': { $ref: '#/components/responses/Error', description: "`LAST_ADMIN` — would leave no active verified admin" }
        '422': { $ref: '#/components/responses/Error', description: "`SELF_BLOCK` — an admin cannot block themselves; or `VALIDATION_ERROR`" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    cronBearer: { type: http, scheme: bearer, description: CRON_SECRET (sent by Vercel Cron) }
    cronHeader: { type: apiKey, in: header, name: x-cron-secret }
  parameters:
    Id: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
    NotificationLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 }, description: 'NOTIF-03 page size (owner 2026-11-22: max 50, default 20)' }
    CsrfToken: { name: X-CSRF-Token, in: header, required: true, schema: { type: string }, description: Token from GET /auth/csrf }
  responses:
    Error:
      description: Error (always carries `requestId`, also sent as response header `x-request-id`)
      headers:
        x-request-id: { schema: { type: string } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: |
        Too many requests (NFR-01). Error code `RATE_LIMITED`. Counters live in MongoDB (shared by all instances), fixed window per key. `Retry-After` is the number of seconds until the window resets; `RateLimit` is the IETF draft-7 structured header (`limit=<n>, remaining=<n>, reset=<seconds>`) and `RateLimit-Policy` its policy (`<n>;w=<window seconds>`). The same `RateLimit` headers are also sent on successful responses of rate-limited routes. If the counter store is unavailable the request is allowed (fail open) and the error is logged.
      headers:
        x-request-id: { schema: { type: string } }
        Retry-After: { schema: { type: integer, minimum: 0 }, description: Seconds until the window resets }
        RateLimit: { schema: { type: string, examples: ['limit=10, remaining=0, reset=840'] } }
        RateLimit-Policy: { schema: { type: string, examples: ['10;w=900'] } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Message:
      description: OK
      content:
        application/json:
          schema: { type: object, properties: { message: { type: string } } }
    AuthSession:
      description: Access token + user; sets `fx_rt` httpOnly refresh cookie
      headers:
        Set-Cookie: { schema: { type: string } }
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken: { type: string }
              user: { $ref: '#/components/schemas/User' }
  schemas:
    ObjectId: { type: string, pattern: '^[a-f0-9]{24}$' }
    Locale: { type: string, enum: [ar, en], default: ar }
    SaudiPhoneInput:
      type: string
      maxLength: 25
      x-canonical-pattern: '^(\+966|00966|0)?5[0-9]{8}$'
      description: >-
        Saudi mobile number (ADR-008). Input longer than 25 characters is rejected before anything else.
        Normalisation steps, in order: (1) trim; (2) convert Arabic-Indic (٠-٩) and Extended Arabic-Indic (۰-۹)
        digits to ASCII 0-9; (3) remove spaces, dashes, dots and parentheses; (4) the result must match
        `x-canonical-pattern` (`05XXXXXXXX`, `5XXXXXXXX`, `+9665XXXXXXXX` or `009665XXXXXXXX`). Anything else
        (letters, mixed scripts, landlines, wrong length) is VALIDATION_ERROR. The stored and returned value is
        always `+9665XXXXXXXX` (SaudiPhone). Clients must apply the same normalisation and then the same pattern.
        The pattern is in `x-canonical-pattern` (not `pattern`) because it applies after normalisation, not to the raw input.
      examples: ['0551234567', '055 123 4567', '+966-55-123-4567', '٠٥٥١٢٣٤٥٦٧']
    SaudiPhone:
      type: string
      pattern: '^\+9665[0-9]{8}$'
      description: Normalized E.164 Saudi mobile number returned by the API.
      examples: ['+966551234567']
    DeliveryCity:
      type: object
      required: [code, name, isActive, sortOrder]
      properties:
        code: { type: string, pattern: '^[a-z0-9-]+$', description: Unique, immutable slug (e.g. riyadh) }
        name: { $ref: '#/components/schemas/LocalizedText' }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        deliveryFee: { type: [integer, 'null'], minimum: 0, description: Optional admin-set per-city fee override in halalas; null = use the base deliveryFee, and if that is unset, 0 (ADR-009) }
    VatSetting:
      type: object
      required: [vatRate, applyToDelivery, pricesIncludeVat]
      properties:
        vatRate: { type: number, minimum: 0, maximum: 50, multipleOf: 0.01, default: 0, description: 'VAT percentage, e.g. 15 = 15%. 0 (default) means no VAT line anywhere.' }
        applyToDelivery: { type: boolean, default: true, description: 'Apply VAT to the delivery fee; only effective when vatRate > 0' }
        pricesIncludeVat: { type: boolean, default: true }
        registrationNumber: { type: [string, 'null'], pattern: '^3[0-9]{13}3$', description: 15-digit VAT registration number, printed on invoices }
    OrderVat:
      type: object
      description: Immutable snapshot taken at order placement (ADR-009)
      required: [vatRate, vatAmount, applyToDelivery, pricesIncludeVat]
      properties:
        vatRate: { type: number }
        vatAmount: { type: integer, description: VAT amount in halalas (0 when vatRate is 0) }
        applyToDelivery: { type: boolean }
        pricesIncludeVat: { type: boolean }
        registrationNumber: { type: [string, 'null'] }
    Role: { type: string, enum: [ADMIN, CUSTOMER] }
    OtpPurpose: { type: string, enum: [VERIFY_EMAIL, RESET_PASSWORD], description: "Purposes accepted by POST /auth/resend-otp. A third purpose INVITE_ADMIN exists in the data model (T-017) but is issued and resent only via /admin/admins; resend-otp rejects it (422)." }
    ProductType: { type: string, enum: [NEW, RESALE] }
    Condition: { type: string, enum: [NEW, LIKE_NEW, GOOD, FAIR] }
    ProductStatus: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
    OrderStatus: { type: string, enum: [PENDING, CONFIRMED, PROCESSING, OUT_FOR_DELIVERY, DELIVERED, CANCELLED] }
    SectionType: { type: string, enum: [FEATURED_PRODUCTS, NEW_ARRIVALS, RESALE_PICKS, CATEGORY_GRID, PROMO_BANNER, TESTIMONIALS, SHOP_THE_LOOK] }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [VALIDATION_ERROR, BAD_REQUEST, PAYLOAD_TOO_LARGE, INTERNAL_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, OUT_OF_STOCK, RATE_LIMITED, OTP_INVALID, OTP_EXPIRED, EMAIL_IN_USE, EMAIL_NOT_VERIFIED, ACCOUNT_BLOCKED, ACCOUNT_LOCKED, INVALID_CREDENTIALS, REFRESH_RACE, CSRF_INVALID, UPLOAD_NOT_ALLOWED, INVALID_TRANSITION, OUT_OF_DELIVERY_AREA, ADDRESS_LIMIT_REACHED, SLUG_TAKEN, CATEGORY_HAS_PRODUCTS, CATEGORY_HAS_CHILDREN, STALE_UPDATE, CITY_CODE_IMMUTABLE, CART_CONFLICT, CART_LIMIT_REACHED, CART_EMPTY, WISHLIST_LIMIT_REACHED, WISHLIST_CONFLICT, PRICE_CHANGED, TOO_MANY_PENDING_ORDERS, IDEMPOTENCY_MISMATCH, SELF_BLOCK, LAST_ADMIN, ALREADY_VERIFIED, CUSTOMER_HAS_OPEN_ORDERS, FORBIDDEN_TARGET, CUSTOMER_DELETED, CONFIRM_EMAIL_MISMATCH] }
        message: { type: string, description: "English only, for logs and developers. Clients must not display it; they localise by `code` (en/ar message catalogues, generic fallback)." }
        details: {}
        requestId: { type: string }
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    CronCleanupResult:
      type: object
      description: Counts of documents removed by /internal/cron/cleanup (NFR-08). `uploads` counts rows actually removed — a row kept because its R2 delete failed is not counted.
      required: [otps, refreshTokens, socketEvents, uploads, notifications]
      properties:
        otps: { type: integer }
        refreshTokens: { type: integer }
        socketEvents: { type: integer }
        uploads: { type: integer }
        notifications: { type: integer }
    LocalizedText:
      type: object
      required: [en, ar]
      properties:
        en: { type: string }
        ar: { type: string }
    ImageAsset:
      type: object
      required: [key, url]
      description: Stored image. In request bodies only `key` is trusted; the server recomputes `url` from `key` (R2_PUBLIC_BASE_URL + "/" + key) and rejects keys outside `furnixa/{env}/`.
      properties:
        key: { type: string, description: R2 object key, examples: ['furnixa/production/2026/11/3f2b8c1e-0c4d-4a52-9d7e-1b2a3c4d5e6f.webp'] }
        url: { type: string, format: uri }
        # alt/width/height are optional composite fields; writers store explicit null (rule 8), so responses carry null, not absence (T-019).
        alt: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        # CR-011 (banner photos only): the point of the photo that must stay visible when it is cropped, in percent. The storefront applies it as object-position at every breakpoint. Absent or null = centre.
        focalX: { type: [number, 'null'], minimum: 0, maximum: 100 }
        focalY: { type: [number, 'null'], minimum: 0, maximum: 100 }
    ImageAssetInput:
      type: object
      additionalProperties: false
      required: [key]
      description: >-
        Image in a request body: only the R2 `key` (from the presign route) plus optional `alt`. The server
        recomputes `url` from `key`; a sent `url` is rejected (unknown field). Keys outside `furnixa/{env}/` or
        without a matching unattached `Upload` row -> 422 `UPLOAD_NOT_ALLOWED`.
      properties:
        key: { type: string, description: R2 object key, examples: ['furnixa/production/2026/11/3f2b8c1e-0c4d-4a52-9d7e-1b2a3c4d5e6f.webp'] }
        alt: { $ref: '#/components/schemas/LocalizedText' }
    User:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        phone: { oneOf: [{ $ref: '#/components/schemas/SaudiPhone' }, { type: 'null' }] }
        avatarUrl: { type: [string, 'null'], description: "R2_PUBLIC_BASE_URL/key, or null; computed from the stored key" }
        isVerified: { type: boolean }
        isBlocked: { type: boolean }
        preferredLocale: { $ref: '#/components/schemas/Locale' }
        createdAt: { type: string, format: date-time }
    AdminCustomer:
      description: A customer as the admin sees it (CR-011, ADM-17). The blocked reason is admin-only and never part of the public User. No password hash, ever.
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            updatedAt: { type: string, format: date-time, description: Send back as `expectedUpdatedAt` when editing }
            blockedReason: { type: [string, 'null'], description: Why the customer was blocked (3 to 300 chars); null when not blocked }
            blockedAt: { type: [string, 'null'], format: date-time }
            blockedById: { type: [string, 'null'], description: Id of the admin who blocked the customer }
            deletedAt: { type: [string, 'null'], format: date-time, description: Set when the customer was soft-deleted and anonymised }
            deletedById: { type: [string, 'null'] }
    CustomerBlockInput:
      type: object
      additionalProperties: false
      required: [isBlocked]
      properties:
        isBlocked: { type: boolean }
        reason: { type: string, minLength: 3, maxLength: 300, description: Required when `isBlocked` is true (admin-only, never shown to the customer). Optional and not stored when unblocking }
    CustomerPatch:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt]
      minProperties: 2
      properties:
        expectedUpdatedAt: { type: string, format: date-time }
        firstName: { type: string, minLength: 1, maxLength: 40 }
        lastName: { type: string, minLength: 1, maxLength: 40 }
        phone: { description: A Saudi mobile (SaudiPhoneInput), stored as +9665XXXXXXXX; null clears it, oneOf: [{ type: string }, { type: 'null' }] }
    CustomerDeleteInput:
      type: object
      additionalProperties: false
      required: [confirmEmail]
      properties:
        confirmEmail: { type: string, description: The customer's exact email, typed by the admin }
    CustomerListItem:
      allOf:
        - $ref: '#/components/schemas/AdminCustomer'
        - type: object
          properties:
            orderCount: { type: integer, description: Total orders of this customer (any status), derived (ADM-05) }
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            invitedById: { type: [string, 'null'], description: "Id of the admin who created the invite; null for non-invited admins (e.g. the seeded admin). Audit only (T-017)." }
    AddressInput:
      type: object
      additionalProperties: false
      required: [label, fullName, phone, cityCode, area, street]
      properties:
        label: { type: string, minLength: 1, maxLength: 30 }
        fullName: { type: string, minLength: 1, maxLength: 80 }
        phone: { $ref: '#/components/schemas/SaudiPhoneInput' }
        cityCode: { type: string, description: Code of an active DeliveryCity from /cms/settings (ADR-008); stored in its canonical form }
        area: { type: string, minLength: 1, maxLength: 80 }
        street: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: string, maxLength: 300 }
        isDefault: { type: boolean }
    AddressPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Any subset of AddressInput (same limits).
      properties:
        label: { type: string, minLength: 1, maxLength: 30 }
        fullName: { type: string, minLength: 1, maxLength: 80 }
        phone: { $ref: '#/components/schemas/SaudiPhoneInput' }
        cityCode: { type: string }
        area: { type: string, minLength: 1, maxLength: 80 }
        street: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: string, maxLength: 300 }
        isDefault: { type: boolean }
    Address:
      type: object
      required: [id, label, fullName, phone, cityCode, area, street, isDefault, isDeliverable]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        label: { type: string, minLength: 1, maxLength: 30 }
        fullName: { type: string, minLength: 1, maxLength: 80 }
        phone: { $ref: '#/components/schemas/SaudiPhone' }
        cityCode: { type: string }
        area: { type: string, minLength: 1, maxLength: 80 }
        street: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: [string, 'null'], maxLength: 300 }
        isDefault: { type: boolean }
        isDeliverable:
          type: boolean
          readOnly: true
          description: >-
            True only when `cityCode` is an active city in `SiteSetting.deliveryCities` at the time of the request
            (read per request, no cache; compared trimmed and lowercased like `assertActiveCity`). A saved address
            whose city was deactivated later returns false and stays editable. Clients show "Not deliverable" from this
            field; checkout still re-checks the city on the server (422 OUT_OF_DELIVERY_AREA).
    CategoryName:
      type: object
      required: [en, ar]
      description: Localized category name; both locales required (I18N-02), trimmed, 1-60 chars each.
      properties:
        en: { type: string, minLength: 1, maxLength: 60 }
        ar: { type: string, minLength: 1, maxLength: 60 }
    CategoryInput:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { $ref: '#/components/schemas/CategoryName' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 60 }
        image: { oneOf: [{ $ref: '#/components/schemas/ImageAssetInput' }, { type: 'null' }] }
        parentId: { type: [string, 'null'], description: Id of a ROOT category (one level of nesting, CAT-01) or null }
        sortOrder: { type: integer, minimum: 0, default: 0 }
        isActive: { type: boolean, default: true }
    CategoryPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Any subset of CategoryInput (same limits).
      properties:
        name: { $ref: '#/components/schemas/CategoryName' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 60 }
        image: { oneOf: [{ $ref: '#/components/schemas/ImageAssetInput' }, { type: 'null' }] }
        parentId: { type: [string, 'null'] }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
    Category:
      type: object
      required: [id, name, slug, parentId, sortOrder, isActive]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        name: { $ref: '#/components/schemas/CategoryName' }
        slug: { type: string }
        image: { oneOf: [{ $ref: '#/components/schemas/ImageAsset' }, { type: 'null' }] }
        parentId: { type: [string, 'null'] }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        children:
          type: array
          items: { $ref: '#/components/schemas/Category' }
          description: Only in the public tree (GET /categories), one level deep.
        productCount:
          type: integer
          readOnly: true
          description: Only in the admin list (GET /admin/categories); products in any status, incl. ARCHIVED.
    Dimensions:
      type: object
      properties:
        widthCm: { type: number }
        depthCm: { type: number }
        heightCm: { type: number }
        weightKg: { type: number }
    ProductTitle:
      type: object
      required: [en, ar]
      description: >-
        Localized, each locale ≤ 120 chars. DRAFT requires at least one non-empty locale; PUBLISHED requires
        both non-empty (trimmed; I18N-02, owner 2026-11-22).
      properties:
        en: { type: string, maxLength: 120 }
        ar: { type: string, maxLength: 120 }
    ProductDescription:
      type: object
      required: [en, ar]
      description: Same locale rules as ProductTitle; each locale ≤ 5000 chars.
      properties:
        en: { type: string, maxLength: 5000 }
        ar: { type: string, maxLength: 5000 }
    ProductInput:
      type: object
      additionalProperties: false
      required: [title, description, slug, type, condition, price, stock, categoryId]
      description: >-
        Limits (owner 2026-11-22, T-010): price/compareAtPrice 0..100000000 halalas (1,000,000 SAR),
        `compareAtPrice` > `price` when set, stock 0..100000. Type NEW ⇔ condition NEW; RESALE ⇔
        LIKE_NEW/GOOD/FAIR. Image keys must be distinct.
      properties:
        title: { $ref: '#/components/schemas/ProductTitle' }
        description: { $ref: '#/components/schemas/ProductDescription' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 60 }
        sku: { type: [string, 'null'], minLength: 1, maxLength: 40 }
        type: { $ref: '#/components/schemas/ProductType' }
        condition: { $ref: '#/components/schemas/Condition' }
        conditionNotes: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }], description: '≤ 1000 chars per locale' }
        price: { type: integer, minimum: 0, maximum: 100000000, description: halalas }
        compareAtPrice: { type: [integer, 'null'], minimum: 0, maximum: 100000000, description: must be greater than price when set }
        stock: { type: integer, minimum: 0, maximum: 100000 }
        categoryId: { $ref: '#/components/schemas/ObjectId' }
        images: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/ImageAssetInput' } }
        dimensions: { oneOf: [{ $ref: '#/components/schemas/Dimensions' }, { type: 'null' }] }
        material: { type: [string, 'null'], minLength: 1, maxLength: 60 }
        color: { type: [string, 'null'], minLength: 1, maxLength: 60 }
        isFeatured: { type: boolean, default: false }
        status: { $ref: '#/components/schemas/ProductStatus' }
    ProductPatch:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [expectedUpdatedAt]
      description: >-
        Any subset of ProductInput (same limits) plus the required `expectedUpdatedAt` and at least one field to
        change. Rules are enforced on the merged result.
      properties:
        expectedUpdatedAt: { type: string, format: date-time, description: The `updatedAt` the admin loaded; mismatch -> 409 STALE_UPDATE }
        title: { $ref: '#/components/schemas/ProductTitle' }
        description: { $ref: '#/components/schemas/ProductDescription' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 60 }
        sku: { type: [string, 'null'], minLength: 1, maxLength: 40 }
        type: { $ref: '#/components/schemas/ProductType' }
        condition: { $ref: '#/components/schemas/Condition' }
        conditionNotes: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        price: { type: integer, minimum: 0, maximum: 100000000 }
        compareAtPrice: { type: [integer, 'null'], minimum: 0, maximum: 100000000 }
        stock: { type: integer, minimum: 0, maximum: 100000 }
        categoryId: { $ref: '#/components/schemas/ObjectId' }
        images: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/ImageAssetInput' } }
        dimensions: { oneOf: [{ $ref: '#/components/schemas/Dimensions' }, { type: 'null' }] }
        material: { type: [string, 'null'], minLength: 1, maxLength: 60 }
        color: { type: [string, 'null'], minLength: 1, maxLength: 60 }
        isFeatured: { type: boolean }
        status: { $ref: '#/components/schemas/ProductStatus' }
    Product:
      type: object
      required: [id, title, description, slug, type, condition, price, stock, categoryId, images, isFeatured, status, createdAt, updatedAt]
      description: Stored images carry the server-computed `url`. `searchText` is internal and never returned.
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        title: { $ref: '#/components/schemas/ProductTitle' }
        description: { $ref: '#/components/schemas/ProductDescription' }
        slug: { type: string }
        sku: { type: [string, 'null'] }
        type: { $ref: '#/components/schemas/ProductType' }
        condition: { $ref: '#/components/schemas/Condition' }
        conditionNotes: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        price: { type: integer, description: halalas }
        compareAtPrice: { type: [integer, 'null'] }
        stock: { type: integer }
        categoryId: { $ref: '#/components/schemas/ObjectId' }
        category: { $ref: '#/components/schemas/Category' }
        images: { type: array, items: { $ref: '#/components/schemas/ImageAsset' } }
        dimensions: { oneOf: [{ $ref: '#/components/schemas/Dimensions' }, { type: 'null' }] }
        material: { type: [string, 'null'] }
        color: { type: [string, 'null'] }
        isFeatured: { type: boolean }
        status: { $ref: '#/components/schemas/ProductStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: Send back as `expectedUpdatedAt` on PATCH }
    ProductPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    Wishlist:
      type: object
      properties:
        productIds: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ObjectId' }, description: Ids of PUBLISHED products, newest first }
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        total: { type: integer, description: Number of PUBLISHED favourites (= items.length) }
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              product:
                anyOf: [{ $ref: '#/components/schemas/Product' }, { type: 'null' }]
                description: Null when the product no longer exists (issue UNAVAILABLE)
              qty: { type: integer, description: Effective quantity (stored qty capped at live stock; 0 when OUT_OF_STOCK/UNAVAILABLE) }
              lineTotal: { type: integer, description: unitPrice × effective qty; 0 for OUT_OF_STOCK/UNAVAILABLE lines }
              issue:
                type: [string, 'null']
                enum: [UNAVAILABLE, OUT_OF_STOCK, QTY_REDUCED, PRICE_CHANGED, null]
                description: 'Priority when several apply: UNAVAILABLE > OUT_OF_STOCK > QTY_REDUCED > PRICE_CHANGED'
              details: { type: ['object', 'null'], description: 'PRICE_CHANGED only: {oldPrice, newPrice} in halalas (oldPrice = the line''s stored priceSeen)' }
        subtotal: { type: integer, description: Sum of effective lineTotals; 0 for an empty cart }
        deliveryFee: { type: integer, description: 'Resolved fee in halalas; 0 renders as "Free delivery"; always 0 when no effective lines' }
        vat: { $ref: '#/components/schemas/OrderVat' }
        total: { type: integer, description: 'subtotal + deliveryFee, plus vat.vatAmount when prices exclude VAT; 0 when no effective lines' }
        address:
          type: ['object', 'null']
          description: Present only when `addressId` was given. `isDeliverable` uses the T-007 rule (active city in SiteSetting.deliveryCities); false means the web shows "We don't deliver to this city" and disables checkout (web T-036/T-038).
          properties:
            id: { $ref: '#/components/schemas/ObjectId' }
            cityCode: { type: string }
            isDeliverable: { type: boolean }
    StatusEvent:
      type: object
      description: >-
        `byUserId` and `note` are internal (owner 2026-11-22, T-014): admin responses only.
        Customer responses (/orders, /orders/{id}) return each event as {status, at} only.
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        at: { type: string, format: date-time }
        byUserId: { $ref: '#/components/schemas/ObjectId' }
        note: { type: [string, 'null'], description: "null when the transition carried no note (writers store explicit null, rule 8; T-019)" }
    OrderAddress:
      type: object
      description: Immutable snapshot of the delivery address at placement — canonical E.164 phone, `city` name copied from the DeliveryCity. Editing or deleting the Address later never changes it.
      properties:
        fullName: { type: string }
        phone: { $ref: '#/components/schemas/SaudiPhone' }
        cityCode: { type: string }
        city: { $ref: '#/components/schemas/LocalizedText' }
        area: { type: string }
        street: { type: string }
        notes: { type: [string, 'null'] }
    Order:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        orderNo: { type: string, description: 'FX-YYYYMMDD-NNNN; the date is Asia/Riyadh (fixed UTC+3), NNNN a daily sequence padded to 4 digits', examples: [FX-20261120-0042] }
        user:
          type: object
          description: Slim customer for display (self on /orders, the buyer on /admin/orders) — never the full account.
          properties:
            id: { $ref: '#/components/schemas/ObjectId' }
            firstName: { type: string }
            lastName: { type: string }
            email: { type: string, format: email }
        items:
          type: array
          items:
            type: object
            properties:
              productId: { $ref: '#/components/schemas/ObjectId' }
              titleSnapshot: { $ref: '#/components/schemas/LocalizedText' }
              sku: { type: [string, 'null'] }
              imageSnapshot: { type: [string, 'null'], description: URL of the product's first image at placement; the R2 key is stored server-side (`imageKey`) and never deleted while referenced }
              unitPrice: { type: integer }
              qty: { type: integer }
              lineTotal: { type: integer, description: From `computePricing` (per-line ZATCA VAT hook, B-013) }
              type: { $ref: '#/components/schemas/ProductType' }
              condition: { $ref: '#/components/schemas/Condition' }
        address: { $ref: '#/components/schemas/OrderAddress' }
        subtotal: { type: integer }
        deliveryFee: { type: integer, description: Snapshot of the fee resolved at placement (free threshold, city override, base fee, else 0) }
        vat: { $ref: '#/components/schemas/OrderVat' }
        total: { type: integer, description: 'subtotal + deliveryFee, plus vat.vatAmount when prices exclude VAT' }
        currency: { type: string, enum: [SAR] }
        paymentMethod: { type: string, enum: [COD] }
        paymentStatus: { type: string, enum: [UNPAID, PAID] }
        status: { $ref: '#/components/schemas/OrderStatus' }
        statusHistory: { type: array, description: 'Placement writes the initial event {status: PENDING, at, byUserId: <the customer>}', items: { $ref: '#/components/schemas/StatusEvent' } }
        customerNote: { type: [string, 'null'], description: Plain text; always rendered escaped by consumers }
        adminNote: { type: [string, 'null'], description: 'Internal, admin responses only (trimmed, max 2000; owner 2026-11-22, T-014) — omitted from customer responses and never in emails' }
        createdAt: { type: string, format: date-time }
    OrderPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    Notification:
      type: object
      description: >-
        One user's notification row (NOTIF-03). It is also the `notification:new` socket event payload —
        every recipient receives their OWN serialized row, id included, via room `user:{id}` (owner
        2026-11-22, T-016). The row is written before the emit; the row is the source of truth.
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        type: { type: string, enum: [ORDER_PLACED, ORDER_STATUS, NEW_ORDER, SYSTEM] }
        title: { $ref: '#/components/schemas/LocalizedText' }
        body: { $ref: '#/components/schemas/LocalizedText' }
        link: { type: [string, 'null'], description: 'Logical path to the related resource, e.g. /orders/{orderId}; clients map it to their own routes — `data` is the authoritative navigation payload (owner 2026-11-22, T-016)' }
        data: { type: [object, 'null'], description: 'Navigation payload, e.g. {orderId, orderNo, status} (T-016)' }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    SafeHref:
      type: string
      maxLength: 500
      description: >-
        A same-site path ("/" followed by a character other than "/" or "\") or an absolute https:// URL.
        Protocol-relative ("//host", "/\host"), javascript:, data: and http: are rejected -> 422
        VALIDATION_ERROR (owner 2026-11-22, T-011).
    BannerImageInput:
      allOf:
        - $ref: '#/components/schemas/ImageAssetInput'
        - type: object
          required: [alt]
          description: "Banner images require localized alt text in both en and ar (UI-02, owner 2026-11-22) -> 422 if missing. CR-011 adds the optional `focalX` and `focalY` (0 to 100, both or neither) that set the focal point; sending neither clears it."
          properties:
            focalX: { type: number, minimum: 0, maximum: 100 }
            focalY: { type: number, minimum: 0, maximum: 100 }
    BannerInput:
      type: object
      additionalProperties: false
      required: [title, imageDesktop]
      description: >-
        `title` needs both locales non-empty (<= 120 chars); subtitle <= 200 and ctaLabel <= 40 per locale.
        `startsAt` must be before `endsAt` when both are set (checked on the merged result on PATCH) -> 422.
      properties:
        title: { $ref: '#/components/schemas/LocalizedText' }
        subtitle: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        ctaLabel: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        ctaHref: { oneOf: [{ $ref: '#/components/schemas/SafeHref' }, { type: 'null' }] }
        imageDesktop: { $ref: '#/components/schemas/BannerImageInput' }
        imageMobile: { oneOf: [{ $ref: '#/components/schemas/BannerImageInput' }, { type: 'null' }] }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        sortOrder: { type: integer, minimum: 0, default: 0 }
        isActive: { type: boolean, default: true }
    BannerPatch:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [expectedUpdatedAt]
      description: Any subset of BannerInput (same limits) plus the required `expectedUpdatedAt` and at least one field to change; mismatch -> 409 STALE_UPDATE.
      properties:
        expectedUpdatedAt: { type: string, format: date-time, description: The `updatedAt` the admin loaded }
        title: { $ref: '#/components/schemas/LocalizedText' }
        subtitle: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        ctaLabel: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        ctaHref: { oneOf: [{ $ref: '#/components/schemas/SafeHref' }, { type: 'null' }] }
        imageDesktop: { $ref: '#/components/schemas/BannerImageInput' }
        imageMobile: { oneOf: [{ $ref: '#/components/schemas/BannerImageInput' }, { type: 'null' }] }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
    Banner:
      type: object
      required: [id, title, imageDesktop, sortOrder, isActive, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        title: { $ref: '#/components/schemas/LocalizedText' }
        subtitle: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        ctaLabel: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        ctaHref: { type: [string, 'null'] }
        imageDesktop: { $ref: '#/components/schemas/ImageAsset' }
        imageMobile: { oneOf: [{ $ref: '#/components/schemas/ImageAsset' }, { type: 'null' }] }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        updatedAt: { type: string, format: date-time, description: Send back as `expectedUpdatedAt` on PATCH }
    HomeSectionConfig:
      type: object
      additionalProperties: false
      properties:
        productIds: { type: array, maxItems: 24, items: { $ref: '#/components/schemas/ObjectId' } }
        categoryIds: { type: array, maxItems: 24, items: { $ref: '#/components/schemas/ObjectId' } }
        limit: { type: integer, minimum: 1, maximum: 24, description: 'Resolved product count; default 8' }
        bannerId: { $ref: '#/components/schemas/ObjectId' }
        testimonials:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required: [name, quote]
            properties:
              name: { type: string, minLength: 1, maxLength: 80 }
              quote: { $ref: '#/components/schemas/LocalizedText', description: '<= 500 chars per locale' }
        look:
          type: object
          additionalProperties: false
          required: [image, hotspots]
          description: >-
            SHOP_THE_LOOK only (ADM-15): required for that type, rejected (422) for every other type. In a
            request `image` is an `ImageAssetInput` (R2 key from the upload flow plus alt text in both locales,
            UI-02); in a response it is the stored `ImageAsset`. The photo is attached to the section like a banner
            image and released when the section is deleted or the photo replaced.
          properties:
            image: { oneOf: [{ $ref: '#/components/schemas/ImageAssetInput' }, { $ref: '#/components/schemas/ImageAsset' }] }
            hotspots:
              type: array
              minItems: 1
              maxItems: 4
              items:
                type: object
                additionalProperties: false
                required: [x, y, productId]
                properties:
                  x: { type: number, minimum: 0, maximum: 100, description: Percent from the inline start of the photo }
                  y: { type: number, minimum: 0, maximum: 100, description: Percent from the top of the photo }
                  productId: { $ref: '#/components/schemas/ObjectId' }
    ResolvedLook:
      type: object
      required: [image, hotspots]
      description: Resolved SHOP_THE_LOOK payload on `GET /cms/home` (ADM-15). Hotspots keep the admin's order.
      properties:
        image: { $ref: '#/components/schemas/ImageAsset' }
        hotspots:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            required: [x, y, product]
            properties:
              x: { type: number, minimum: 0, maximum: 100 }
              y: { type: number, minimum: 0, maximum: 100 }
              product: { $ref: '#/components/schemas/Product' }
    HomeSectionInput:
      type: object
      required: [type, title]
      description: >-
        `title` needs both locales non-empty (<= 120 chars); subtitle <= 200 per locale. Unknown fields
        are rejected (422, zod strict) — not expressed as `additionalProperties: false` here because this
        schema is composed into the HomeSection response schema (T-019).
      properties:
        type: { $ref: '#/components/schemas/SectionType' }
        title: { $ref: '#/components/schemas/LocalizedText' }
        subtitle: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        config: { $ref: '#/components/schemas/HomeSectionConfig' }
        sortOrder: { type: integer, minimum: 0, default: 0 }
        isVisible: { type: boolean, default: true }
    HomeSectionPatch:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [expectedUpdatedAt]
      description: Any subset of HomeSectionInput (same limits) plus the required `expectedUpdatedAt` and at least one field to change; mismatch -> 409 STALE_UPDATE.
      properties:
        expectedUpdatedAt: { type: string, format: date-time, description: The `updatedAt` the admin loaded }
        type: { $ref: '#/components/schemas/SectionType' }
        title: { $ref: '#/components/schemas/LocalizedText' }
        subtitle: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        config: { $ref: '#/components/schemas/HomeSectionConfig' }
        sortOrder: { type: integer, minimum: 0 }
        isVisible: { type: boolean }
    HomeSection:
      type: object
      required: [id, type, title, subtitle, config, sortOrder, isVisible, updatedAt]
      description: Response shape — every field is always present; subtitle/config are null when unset (T-019).
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        type: { $ref: '#/components/schemas/SectionType' }
        title: { $ref: '#/components/schemas/LocalizedText' }
        subtitle: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        config: { oneOf: [{ $ref: '#/components/schemas/HomeSectionConfig' }, { type: 'null' }], description: null when the section was created without a config }
        sortOrder: { type: integer, minimum: 0 }
        isVisible: { type: boolean }
        updatedAt: { type: string, format: date-time, description: Send back as `expectedUpdatedAt` on PATCH }
    PageInput:
      type: object
      required: [slug, title, content]
      description: >-
        `content` is HTML, sanitised server-side on every write (allowlist of Tiptap tags; img only from
        R2_PUBLIC_BASE_URL; links https or same-site; ADR-013). Title <= 120, content <= 50000, metaTitle <= 120,
        metaDescription <= 300 chars per locale. Publish gate (I18N-02): `isPublished` true requires title and
        content non-empty in both locales; false requires at least one. Unknown fields are rejected (422,
        zod strict) — not expressed as `additionalProperties: false` here because this schema is composed
        into the Page response schema (T-019).
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 60, description: Unique -> 409 SLUG_TAKEN }
        title: { $ref: '#/components/schemas/LocalizedText' }
        content: { $ref: '#/components/schemas/LocalizedText' }
        metaTitle: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        metaDescription: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        isPublished: { type: boolean, default: false }
    PagePatch:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [expectedUpdatedAt]
      description: Any subset of PageInput (same limits and sanitisation) plus the required `expectedUpdatedAt` and at least one field to change; mismatch -> 409 STALE_UPDATE.
      properties:
        expectedUpdatedAt: { type: string, format: date-time, description: The `updatedAt` the admin loaded }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 60 }
        title: { $ref: '#/components/schemas/LocalizedText' }
        content: { $ref: '#/components/schemas/LocalizedText' }
        metaTitle: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        metaDescription: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        isPublished: { type: boolean }
    Page:
      allOf:
        - $ref: '#/components/schemas/PageInput'
        - type: object
          required: [id, updatedAt]
          properties:
            id: { $ref: '#/components/schemas/ObjectId' }
            updatedAt: { type: string, format: date-time, description: Send back as `expectedUpdatedAt` on PATCH }
    SiteSettingInput:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt, storeName, contactEmail, contactPhone, deliveryFee, vat, deliveryCities, defaultLocale]
      description: >-
        Body of PUT /admin/settings (full replace, owner 2026-11-22, T-011). `currency` is fixed to SAR and not
        accepted (unknown field -> 422). The logo is an ImageAssetInput (`url` recomputed from `key`). Limits:
        storeName <= 120, address <= 300 per locale, contactEmail <= 120, contactPhone free text <= 40, social
        URLs <= 300, SEO title <= 120 / description <= 300 per locale, city name <= 60 per locale, city code
        <= 40. Duplicate city codes, a missing ar/en city name, no active city or > 100 cities -> 422.
        Delivery-city codes are immutable: every existing code must be present (T-022), see PUT /admin/settings.
      properties:
        expectedUpdatedAt: { type: string, format: date-time, description: The `updatedAt` the admin loaded; mismatch -> 409 STALE_UPDATE }
        storeName: { $ref: '#/components/schemas/LocalizedText' }
        logo: { oneOf: [{ $ref: '#/components/schemas/ImageAssetInput' }, { type: 'null' }] }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string, description: Free text; the store may list a landline }
        address: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        socials:
          type: object
          additionalProperties: false
          properties:
            facebook: { type: [string, 'null'] }
            instagram: { type: [string, 'null'] }
            whatsapp: { type: [string, 'null'] }
            tiktok: { type: [string, 'null'] }
        deliveryFee: { type: integer, minimum: 0, description: Base delivery fee in halalas (negative -> 422) }
        freeDeliveryThreshold: { type: [integer, 'null'], minimum: 0 }
        vat: { $ref: '#/components/schemas/VatSetting' }
        deliveryCities: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/DeliveryCity' } }
        defaultLocale: { $ref: '#/components/schemas/Locale' }
        seo:
          type: object
          additionalProperties: false
          properties:
            title: { $ref: '#/components/schemas/LocalizedText' }
            description: { $ref: '#/components/schemas/LocalizedText' }
    SiteSetting:
      type: object
      properties:
        storeName: { $ref: '#/components/schemas/LocalizedText' }
        # logo/address/socials/seo are optional; writers store explicit null (rule 8), so responses carry null, not absence (T-019).
        logo: { oneOf: [{ $ref: '#/components/schemas/ImageAsset' }, { type: 'null' }] }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string, description: Free text; the store may list a landline }
        address: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
        socials:
          type: [object, 'null']
          properties:
            facebook: { type: [string, 'null'] }
            instagram: { type: [string, 'null'] }
            whatsapp: { type: [string, 'null'] }
            tiktok: { type: [string, 'null'] }
        deliveryFee: { type: integer, minimum: 0, default: 0, description: Base delivery fee in halalas; 0 = free delivery (ADR-009) }
        freeDeliveryThreshold: { type: [integer, 'null'], minimum: 0, default: null, description: Optional. Subtotal (halalas) at or above which delivery is free; null = no threshold }
        vat: { $ref: '#/components/schemas/VatSetting' }
        currency: { type: string, const: SAR, description: ISO 4217; fixed to SAR (ADR-008) }
        deliveryCities:
          type: array
          description: Delivery cities (ADM-13). Public endpoint returns active cities only; admin endpoint returns all.
          items: { $ref: '#/components/schemas/DeliveryCity' }
        defaultLocale: { $ref: '#/components/schemas/Locale' }
        seo:
          type: [object, 'null']
          properties:
            title: { $ref: '#/components/schemas/LocalizedText' }
            description: { $ref: '#/components/schemas/LocalizedText' }
        updatedAt: { type: string, format: date-time, description: Send back as `expectedUpdatedAt` on PUT /admin/settings (admin response; also present on the public endpoint) }
